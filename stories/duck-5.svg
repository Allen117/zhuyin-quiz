<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{transform-origin:30px 28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{animation:wave 2s linear infinite}
@keyframes wave{to{transform:translateX(20px)}}
.bobw{animation:bobw 1.2s ease-in-out infinite alternate}
@keyframes bobw{to{transform:translateY(-3px)}}
.cheer{animation:none}
.zoom{animation:zoom 3.2s ease-in both}
@keyframes zoom{from{transform:translateX(-30px)}to{transform:translateX(200px)}}
.kick{animation:kick .15s linear 20 alternate}
@keyframes kick{to{transform:translateY(-2px) rotate(-3deg)}}
.heart{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.2s ease-out 3.2s forwards}
@keyframes rise{0%{opacity:0;transform:translateY(10px) scale(.3)}40%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:translateY(-6px)}}
</style>
