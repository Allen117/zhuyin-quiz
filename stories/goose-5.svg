<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.wv{animation:wv 3s linear infinite}
@keyframes wv{to{transform:translateX(-40px)}}
.bobw{animation:bobw 1.6s ease-in-out infinite alternate}
@keyframes bobw{to{transform:translateY(2px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.cloud{animation:cloud 8s ease-in-out infinite alternate}
@keyframes cloud{to{transform:translateX(24px)}}
.flap{transform-box:fill-box;transform-origin:10% 60%;animation:flap .22s ease-in-out .2s 10 alternate}
@keyframes flap{to{transform:rotate(-35deg)}}
.pad{animation:pad 2.4s ease-in-out .2s both}
@keyframes pad{25%{transform:translateX(-12px)}75%{transform:translateX(10px)}}
.gtalk{transform-box:fill-box;transform-origin:80% 80%;animation:gtalk .2s ease-in-out 12 alternate}
@keyframes gtalk{to{transform:rotate(8deg)}}
.nod{animation:nod .2s ease-in-out 2.8s 6 alternate}
@keyframes nod{to{transform:translateY(4px)}}
.ok{transform-box:fill-box;transform-origin:50% 0;animation:ok .4s ease-out 2.8s both}
@keyframes ok{to{transform:rotate(-140deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
