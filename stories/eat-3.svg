<ellipse cx="160" cy="146" rx="32" ry="7" fill="#fff"/><ellipse cx="160" cy="144" rx="22" ry="3.5" fill="none" stroke="#ccc" stroke-width="1.2"/>
<g transform="translate(160 138) scale(1.4)"><g class="bn"><path d="M-12 0 h26 M-4 -5 v10 M2 -5 v10 M8 -5 v10" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M14 0 l7 -5 v10z" fill="none" stroke="#fff" stroke-width="2"/><circle cx="-14" cy="0" r="4" fill="#fff" stroke="#3a3a3a" stroke-width="1.5"/></g><g class="f1"><path d="M10 0 l10 -7 v14z" fill="#7ec8e3"/><path d="M-14 0 q12 -11 26 0 q-14 11 -26 0z" fill="#7ec8e3"/><circle cx="-7" cy="-1.5" r="1.5" fill="#333" stroke="none"/><path d="M-2 -5 q3 5 0 10" fill="none" stroke-width="1.2"/></g></g>
