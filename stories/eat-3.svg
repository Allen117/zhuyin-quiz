<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.lean{transform-box:fill-box;transform-origin:50% 100%;animation:lean .5s ease-out .3s both,back .4s 2.6s forwards}
@keyframes lean{to{transform:rotate(14deg) translateX(4px)}}
@keyframes back{from{transform:rotate(14deg) translateX(4px)}to{transform:none}}
.chew{transform-box:fill-box;transform-origin:50% 80%;animation:chew .2s ease-in-out 0.9s 8 alternate}
@keyframes chew{to{transform:rotate(4deg)}}
.f1{animation:gone .3s 2.4s forwards}
.bn{opacity:0;animation:show .3s 2.4s forwards}
.lick{opacity:0;animation:show .1s 3s forwards,lk .2s 3s 4 alternate}
@keyframes lk{to{transform:translateX(2px)}}
@keyframes gone{to{opacity:0}}
@keyframes show{to{opacity:1}}
.heart{opacity:0;animation:rise 2s ease-out infinite}
.heart.a{animation-delay:3.1s}.heart.b{animation-delay:3.8s}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(6px,-30px) scale(1.1)}}
.tail{transform-box:fill-box;transform-origin:0 100%;animation:tail 1s ease-in-out infinite alternate}
@keyframes tail{to{transform:rotate(-8deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#fde9ef" stroke="none"/>
<rect y="132" width="240" height="36" fill="#e8b98a" stroke="none"/>
