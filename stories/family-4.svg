<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.note{opacity:0;animation:note 1.2s ease-out both}
@keyframes note{0%{opacity:0;transform:translate(0,12px) scale(.4)}30%{opacity:1}100%{opacity:1;transform:translate(0,-6px) scale(1)}}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw 1.4s ease-in-out infinite alternate}
.tw.b{animation-delay:-.7s}
@keyframes tw{to{transform:scale(.45);opacity:.5}}
.rock{transform-box:fill-box;transform-origin:50% 100%;animation:rock .5s ease-in-out 6 alternate}
@keyframes rock{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.armL{transform-box:fill-box;transform-origin:50% 0;animation:armL .5s ease-out both}
.armR{transform-box:fill-box;transform-origin:50% 0;animation:armR .5s ease-out both}
@keyframes armL{to{transform:rotate(50deg)}}
@keyframes armR{to{transform:rotate(-50deg)}}
</style>
