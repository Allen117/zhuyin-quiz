<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.cl{animation:drift 7s ease-in-out infinite alternate}
.cl.b{animation-delay:-3.5s}
@keyframes drift{to{transform:translateX(26px)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes on{from{opacity:0}to{opacity:1}}
@keyframes off{to{opacity:0}}
.rays{transform-origin:28px 26px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.ball{animation:ball 3.2s both}
@keyframes ball{0%{transform:translateY(-62px);animation-timing-function:ease-in}28%{transform:translateY(0);animation-timing-function:ease-out}52%{transform:translateY(-48px);animation-timing-function:ease-in}76%{transform:translateY(0);animation-timing-function:ease-out}100%{transform:translateY(-40px)}}
.jump{animation:jump 3.2s both}
@keyframes jump{0%,22%,38%,70%,86%,100%{transform:translateY(0)}28%,76%{transform:translateY(-6px)}}
.zap{animation:zap 3.2s both}
@keyframes zap{0%,26%,40%,74%,88%,100%{opacity:0}29%,77%{opacity:1}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#a8dcff" stroke="none"/>
