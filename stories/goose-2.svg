<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.cloud{animation:cloud 8s ease-in-out infinite alternate}
@keyframes cloud{to{transform:translateX(24px)}}
.climb{animation:climb 3s ease-in-out both}
@keyframes climb{to{transform:translateY(-62px)}}
.cl{transform-box:fill-box;transform-origin:50% 0;animation:cl .3s ease-in-out 10 alternate}
.cr{transform-box:fill-box;transform-origin:50% 0;animation:cl .3s ease-in-out .15s 10 alternate,hi .45s ease-in-out 3.1s 4 alternate}
@keyframes cl{to{transform:rotate(-22deg)}}
@keyframes hi{from{transform:rotate(0)}to{transform:rotate(-40deg)}}
.lg{animation:lg .3s ease-in-out 10 alternate}
@keyframes lg{to{transform:translateY(-4px)}}
.bird{animation:bird 5s ease-in-out infinite alternate}
@keyframes bird{to{transform:translate(-30px,8px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#d6efff" stroke="none"/>
<path d="M30 30 q4 -12 18 -8 q10 -10 22 0 q12 0 10 10 h-46 q-8 -2 -4 -2z" fill="#fff" class="cloud"/>
<path class="bird" d="M196 40 q5 -5 10 0 q5 -5 10 0" fill="none" stroke-width="2"/>
<rect y="140" width="240" height="28" fill="#9fd36b" stroke="none"/>
<path d="M150 168 Q170 150 240 148 V168Z" fill="#7fc4ec"/>
<rect x="108" y="34" width="24" height="120" rx="5" fill="#8a5a3c"/>
<path d="M114 60 q4 4 0 8 M126 92 q-4 4 0 8 M114 122 q4 4 0 8" fill="none" stroke-width="1.5"/>
<circle cx="88" cy="38" r="22" fill="#5fb04a"/><circle cx="152" cy="36" r="22" fill="#5fb04a"/><circle cx="120" cy="22" r="26" fill="#6cc055"/>
<path d="M108 154 l-10 4 M132 154 l10 4" stroke="#8a5a3c" stroke-width="5"/>
<g class="climb"><g transform="translate(120 154) scale(1.05)"><g transform="translate(0 0)"><path d="M10 -12 q18 -2 15 -22 q-2 -8 -8 -5" fill="none" stroke="#a0673a" stroke-width="4.5"/><ellipse cx="-8" cy="-6" rx="6" ry="7" fill="#a0673a"/><ellipse cx="8" cy="-6" rx="6" ry="7" fill="#a0673a"/><g transform="rotate(160 -16.5 -38)"><g class="cl"><rect x="-20" y="-38" width="7" height="20" rx="3.5" fill="#a0673a"/><circle cx="-16.5" cy="-17" r="4" fill="#e8c39e"/></g></g><g transform="rotate(-160 16.5 -38)"><g class="cr"><rect x="13" y="-38" width="7" height="20" rx="3.5" fill="#a0673a"/><circle cx="16.5" cy="-17" r="4" fill="#e8c39e"/></g></g><ellipse cy="-24" rx="15" ry="16" fill="#a0673a"/><ellipse cy="-21" rx="9" ry="11" fill="#e8c39e"/><circle cx="-17" cy="-52" r="6" fill="#e8c39e"/><circle cx="17" cy="-52" r="6" fill="#e8c39e"/><circle cy="-52" r="15" fill="#a0673a"/><ellipse cy="-48" rx="11.5" ry="10" fill="#e8c39e"/><circle cx="-5" cy="-52.5" r="2" fill="#333" stroke="none"/><circle cx="5" cy="-52.5" r="2" fill="#333" stroke="none"/><circle cx="-8" cy="-45" r="2.4" fill="#ff9e9e" stroke="none" opacity=".7"/><circle cx="8" cy="-45" r="2.4" fill="#ff9e9e" stroke="none" opacity=".7"/><path d="M-5 -46 q5 8 10 0z" fill="#c0392b" stroke-width="1.5"/></g></g></g>
<g fill="#ff8fb1" stroke-width="1.2"><circle cx="40" cy="150" r="3"/><circle cx="200" cy="146" r="3"/></g>
