<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.blanket{animation:drop .6s ease-out .2s both}
@keyframes drop{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 1.6s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scaleY(1.06)}}
.eo{animation:hide .2s 1.3s forwards}
.ec{opacity:0;animation:show .2s 1.3s forwards}
@keyframes hide{to{opacity:0}}
@keyframes show{to{opacity:1}}
.dark{opacity:0;animation:dim 1.2s 1.8s forwards}
@keyframes dim{to{opacity:.45}}
.zz{opacity:0;animation:show .5s 2.6s forwards}
.z{animation:z 2.4s ease-in-out infinite}
.z.b{animation-delay:-.8s}.z.c{animation-delay:-1.6s}
@keyframes z{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-18px)}}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw 1.4s ease-in-out infinite alternate}
.tw.b{animation-delay:-.7s}
@keyframes tw{to{transform:scale(.45);opacity:.5}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
