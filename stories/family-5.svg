<g transform="translate(200 56)"><g class="tw b"><path d="M0 -7L2 -2L7 0L2 2L0 7L-2 2L-7 0L-2 -2Z" fill="#fff3a0" stroke="none" transform="scale(.5)"/></g></g>
<rect x="40" y="74" width="14" height="70" rx="5" fill="#a0714f"/>
