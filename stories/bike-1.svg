<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.bob{animation:bob .35s ease-in-out 10 alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.upR{transform-box:fill-box;transform-origin:50% 0;animation:upR .4s ease-out both}
.upL{transform-box:fill-box;transform-origin:50% 0;animation:upL .4s ease-out both}
@keyframes upR{to{transform:rotate(-135deg)}}
@keyframes upL{to{transform:rotate(135deg)}}
.drift{animation:drift 7s ease-in-out infinite alternate}
.drift.b{animation-delay:-3.5s}
@keyframes drift{to{transform:translateX(14px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.walk{animation:walk 1.8s ease-out both}
@keyframes walk{from{transform:translate(-130px,0)}to{transform:none}}
.drop{animation:drop .5s cubic-bezier(.3,1.4,.6,1) 2s both}
@keyframes drop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
.hop{animation:hop .4s ease-out 2.6s 2}
@keyframes hop{50%{transform:translateY(-12px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
