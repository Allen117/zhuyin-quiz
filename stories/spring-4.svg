<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{transform-origin:30px 28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease-out forwards;animation-delay:inherit}
.draw{animation-delay:0s}
@keyframes draw{to{stroke-dashoffset:0}}
.dab{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:dab .5s ease-out forwards}
@keyframes dab{from{opacity:1;transform:scale(0)}to{opacity:1;transform:none}}
.arm{transform-box:fill-box;transform-origin:20% 5%;animation:paint 3.5s ease-in-out both}
@keyframes paint{0%{transform:rotate(30deg) translateY(10px)}12%{transform:rotate(-70deg)}25%{transform:rotate(-90deg)}37%{transform:rotate(-60deg)}50%{transform:rotate(-95deg)}62%{transform:rotate(-65deg)}75%{transform:rotate(-100deg)}87%{transform:rotate(-70deg)}100%{transform:rotate(-90deg)}}
</style>
