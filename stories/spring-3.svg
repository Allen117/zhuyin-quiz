<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{transform-origin:30px 28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fly{animation:fly 6s ease-in-out infinite}
@keyframes fly{25%{transform:translate(30px,-14px)}50%{transform:translate(64px,2px)}75%{transform:translate(28px,12px)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap .2s linear infinite alternate}
@keyframes flap{to{transform:scaleX(.3)}}
.sway{animation:none}
.crawl{animation:crawl 4.2s linear both}
@keyframes crawl{from{transform:translate(76px,-2px)}to{transform:translate(196px,4px)}}
.hump{animation:hump .35s ease-in-out 12 alternate}
@keyframes hump{to{transform:translateY(-6px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#d6efff" stroke="none"/>
<g class="rays" stroke="#f5b400" stroke-width="2.5"><path d="M30 6v6M30 44v6M8 28h6M46 28h6M14 12l4 4M42 40l4 4M14 44l4-4M42 16l4-4"/></g>
<circle cx="30" cy="28" r="11" fill="#ffd54f"/>
<g class="sway"><path d="M120 168V150" stroke="#4f9a3a" stroke-width="5"/></g>
<path d="M6 128Q40 70 130 74Q210 78 234 120Q200 154 120 150Q40 150 6 128Z" fill="#7ccf5a"/>
<path d="M14 126Q120 104 226 120" fill="none" stroke="#4f9a3a" stroke-width="2.5"/>
<path d="M60 116l-14-22M100 112l-10-28M140 110l4-26M180 114l12-22" fill="none" stroke="#4f9a3a" stroke-width="1.5"/>
<path d="M160 40q0-12 14-10q6-10 18-4q14-2 14 10q8 4 0 10h-42q-10-2-4-6z" fill="#fff"/>
<g class="crawl"><g transform="translate(0 118)"><g class="hump" style="animation-delay:-0.6s"><circle cx="-55" cy="-8" r="8" fill="#8bcf5a"/></g><g class="hump" style="animation-delay:-0.48s"><circle cx="-44" cy="-8" r="8" fill="#6cc055"/></g><g class="hump" style="animation-delay:-0.36s"><circle cx="-33" cy="-8" r="8" fill="#8bcf5a"/></g><g class="hump" style="animation-delay:-0.24s"><circle cx="-22" cy="-8" r="8" fill="#6cc055"/></g><g class="hump" style="animation-delay:-0.12s"><circle cx="-11" cy="-8" r="8" fill="#8bcf5a"/></g><g class="hump"><circle cx="2" cy="-12" r="10" fill="#8bcf5a"/>
<path d="M-1 -21l-3 -9M5 -21l4 -9" fill="none"/><circle cx="-4" cy="-31" r="2.5" fill="#ff8fb1"/><circle cx="9" cy="-31" r="2.5" fill="#ff8fb1"/>
<circle cx="6" cy="-13" r="2" fill="#2b2b2b" stroke="none"/><path d="M3 -7q3 2 6 0" fill="none" stroke-width="1.4"/>
<circle cx="9" cy="-9" r="2" fill="#ffb3b3" stroke="none"/></g></g></g>
<g class="fly"><g transform="translate(70 36)"><g class="flap"><path d="M0 0q-9-9-12 0q3 7 12 0zM0 0q9-9 12 0q-3 7-12 0z" fill="#ffb74d" stroke-width="1.2"/></g></g></g>
</g></svg>
