<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.cl{animation:drift 7s ease-in-out infinite alternate}
.cl.b{animation-delay:-3.5s}
@keyframes drift{to{transform:translateX(26px)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes on{from{opacity:0}to{opacity:1}}
@keyframes off{to{opacity:0}}
.rays{transform-origin:28px 26px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.pA{animation:off .2s .5s forwards,on .2s 2.8s forwards}
.pB{opacity:0;animation:on .2s .5s forwards,off .2s 2.8s forwards}
.gl{animation:gl .3s ease-in-out .8s 6 alternate}
@keyframes gl{to{transform:translateY(-1.5px)}}
.sw{animation:sw .8s ease-in 2 forwards}
@keyframes sw{to{opacity:0;transform:translateY(10px)}}
.up{opacity:0;animation:up 1s ease-out both}
@keyframes up{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:1;transform:translateY(-6px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
