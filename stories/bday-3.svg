<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes on{from{opacity:0}to{opacity:1}}
@keyframes off{to{opacity:0}}
.up{opacity:0;animation:up 1.2s ease-out both}
@keyframes up{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:1;transform:translateY(-8px)}}
.fall{animation:fall 3s linear infinite}
@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(150px) rotate(360deg)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .3s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.8,1.15)}}
.hop{animation:hop .3s ease-out 4 alternate}
@keyframes hop{to{transform:translateY(-9px)}}

.give{animation:give 1s ease-in-out .3s both}
@keyframes give{to{transform:translate(50.5px,1.8px)}}
.zoom{transform-box:fill-box;transform-origin:70% 100%;animation:pop .5s cubic-bezier(.3,1.5,.6,1) 1.5s both}
.bloom{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.6,1) 2.1s both}
.eA{animation:off .1s 2.7s forwards}
.eB{opacity:0;animation:on .1s 2.7s forwards}
</style>
