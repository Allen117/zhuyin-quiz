<circle cx="30" cy="28" r="11" fill="#ffd54f"/>
<ellipse cx="120" cy="146" rx="150" ry="40" fill="#bfe5a6" stroke="none"/>
<rect y="140" width="240" height="28" fill="#9fd36b" stroke="none"/>
