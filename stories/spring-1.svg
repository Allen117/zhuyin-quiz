<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{transform-origin:30px 28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fly{animation:fly 6s ease-in-out infinite}
@keyframes fly{25%{transform:translate(30px,-14px)}50%{transform:translate(64px,2px)}75%{transform:translate(28px,12px)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap .2s linear infinite alternate}
@keyframes flap{to{transform:scaleX(.3)}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s ease-out both}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.bloom{transform-box:fill-box;transform-origin:50% 50%;animation:bloom .7s cubic-bezier(.3,1.6,.6,1) both}
@keyframes bloom{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.cloud{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(-30px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#d6efff" stroke="none"/>
