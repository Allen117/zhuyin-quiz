<g class="grow" style="animation-delay:0.5s"><path d="M100 142V96" fill="none" stroke="#4f9a3a" stroke-width="3"/><path d="M100 123q10-8 14-2q-7 6-14 2z" fill="#6cc055" stroke-width="1.5"/></g><g class="bloom" style="animation-delay:1.2s"><g fill="#ffe082" stroke-width="1.5"><circle cx="100.0" cy="89.4" r="6"/><circle cx="106.3" cy="94.0" r="6"/><circle cx="103.9" cy="101.3" r="6"/><circle cx="96.1" cy="101.3" r="6"/><circle cx="93.7" cy="94.0" r="6"/></g><circle cx="100" cy="96" r="4.2" fill="#ffd54f" stroke-width="1.5"/></g>
<g class="grow" style="animation-delay:1.0s"><path d="M138 142V106" fill="none" stroke="#4f9a3a" stroke-width="3"/><path d="M138 128q10-8 14-2q-7 6-14 2z" fill="#6cc055" stroke-width="1.5"/></g><g class="bloom" style="animation-delay:1.7s"><g fill="#ff8fb1" stroke-width="1.5"><circle cx="138.0" cy="99.4" r="6"/><circle cx="144.3" cy="104.0" r="6"/><circle cx="141.9" cy="111.3" r="6"/><circle cx="134.1" cy="111.3" r="6"/><circle cx="131.7" cy="104.0" r="6"/></g><circle cx="138" cy="106" r="4.2" fill="#ffd54f" stroke-width="1.5"/></g>
