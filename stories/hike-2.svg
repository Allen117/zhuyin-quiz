<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.green{animation:green 2.6s ease-in-out both}
@keyframes green{from{fill:#d6c79a}to{fill:#8fd16a}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s ease-out both}
@keyframes grow{from{transform:scaleY(0)}70%{transform:scaleY(1.2)}to{transform:none}}
.g0{animation-delay:0.20s}.g1{animation-delay:0.45s}.g2{animation-delay:0.70s}.g3{animation-delay:0.95s}.g4{animation-delay:1.20s}.g5{animation-delay:1.45s}.g6{animation-delay:1.70s}.g7{animation-delay:1.95s}.g8{animation-delay:2.20s}.g9{animation-delay:2.45s}.g10{animation-delay:2.70s}
.cheerl{transform-box:fill-box;transform-origin:100% 0;animation:cl .8s ease-out 3.2s both}
.cheerr{transform-box:fill-box;transform-origin:0 0;animation:cr .8s ease-out 3.2s both}
@keyframes cl{to{transform:rotate(120deg)}}
@keyframes cr{to{transform:rotate(-120deg)}}
.fly{animation:fly 6s ease-in-out infinite}
@keyframes fly{25%{transform:translate(24px,-10px)}50%{transform:translate(46px,4px)}75%{transform:translate(20px,10px)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap .2s linear infinite alternate}
@keyframes flap{to{transform:scaleX(.3)}}
</style>
