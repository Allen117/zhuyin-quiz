<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin .3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ride{animation:ride 3.6s cubic-bezier(.45,0,.4,1) both}
@keyframes ride{from{transform:translate(30px,150px)}to{transform:translate(196px,150px)}}
.speed{opacity:0;animation:speed 3.6s ease-in both}
@keyframes speed{30%{opacity:0}50%,100%{opacity:1}}
.hair{animation:flut .2s linear infinite alternate}
@keyframes flut{to{transform:translateX(-3px)}}
.scroll{animation:scroll 3.6s cubic-bezier(.45,0,.4,1) both}
@keyframes scroll{to{transform:translateX(-50px)}}
</style>
