<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.p1{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:pop .7s ease-out .2s both}
.p2{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:pop .7s ease-out 1.6s both}
.milk{transform-box:fill-box;transform-origin:50% 100%;animation:fill 1s ease-in-out 2.3s both}
@keyframes fill{from{transform:scaleY(0)}to{transform:none}}
.lick{opacity:0;animation:fadein .2s 3.4s forwards}
.eye{animation:fadeout .1s 3.4s forwards}
.spk{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:pop .5s ease-out 3.5s both}
.tw{animation:tw .8s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.3}}
</style>
