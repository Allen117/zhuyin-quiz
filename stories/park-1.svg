<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.away{animation:away 1.6s ease-in .2s both}
@keyframes away{to{transform:translateX(-170px)}}
.stop{animation:gone .5s .3s forwards}
@keyframes gone{to{opacity:0}}
.fall{animation:fall .5s linear infinite}
@keyframes fall{from{transform:translate(2px,-14px)}to{transform:none}}
.sun{transform-box:fill-box;transform-origin:50% 50%;animation:pop .8s cubic-bezier(.3,1.6,.6,1) 1.1s both}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.rays{transform-origin:178px 40px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.jump{animation:jump .3s ease-out 2.1s 4 alternate}
@keyframes jump{to{transform:translateY(-18px)}}
.upl{transform-box:fill-box;transform-origin:50% 0;animation:upl .3s ease-out 2s both}
@keyframes upl{to{transform:rotate(145deg)}}
.upr{transform-box:fill-box;transform-origin:50% 0;animation:upr .3s ease-out 2s both}
@keyframes upr{to{transform:rotate(-145deg)}}
.m1{animation:gone .1s 2s forwards}
.m2{opacity:0;animation:show .1s 2s forwards}
@keyframes show{to{opacity:1}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#bfe6ff" stroke="none"/>
<g class="sun"><g class="rays" stroke="#f5b400" stroke-width="2.5"><path d="M178 16v6M178 58v6M154 40h6M196 40h6M161 23l4 4M191 53l4 4M161 57l4-4M191 27l4-4"/></g><circle cx="178" cy="40" r="14" fill="#ffd54f"/></g>
<g class="away">
<g class="stop"><g class="fall"><path d="M88 40l-2 7M100 48l-2 7M112 40l-2 7M124 48l-2 7M136 40l-2 7M94 58l-2 7M106 62l-2 7M118 58l-2 7M130 62l-2 7" stroke="#4a8fd0" stroke-width="2.2"/></g></g>
<path d="M80 30 q4 -18 24 -14 q12 -14 30 -2 q18 0 16 16 q8 6 -2 10 h-62 q-14 -2 -6 -10z" fill="#9aa8b8"/>
</g>
<ellipse cx="60" cy="146" rx="120" ry="30" fill="#bfe5a6" stroke="none"/>
<rect y="140" width="240" height="28" fill="#9fd36b" stroke="none"/>
<g class="sway"><rect x="18" y="110" width="12" height="32" rx="3" fill="#8a5a3c"/><circle cx="10" cy="106" r="16" fill="#5fb04a"/><circle cx="38" cy="104" r="16" fill="#5fb04a"/><circle cx="24" cy="90" r="18" fill="#6cc055"/></g><g class="sway b"><rect x="208" y="106" width="12" height="36" rx="3" fill="#8a5a3c"/><circle cx="200" cy="102" r="16" fill="#5fb04a"/><circle cx="228" cy="100" r="16" fill="#5fb04a"/><circle cx="214" cy="86" r="18" fill="#6cc055"/></g>
<g fill="#ff8fb1" stroke-width="1.2"><circle cx="60" cy="150" r="3"/><circle cx="160" cy="152" r="3"/><circle cx="190" cy="148" r="3"/></g>
<g class="jump"><g transform="translate(118 148) scale(1.15)"><rect x="-10" y="-18" width="8" height="16" rx="3" fill="#4a6fa5"/><rect x="2" y="-18" width="8" height="16" rx="3" fill="#4a6fa5"/><ellipse cx="-6" cy="-2" rx="6.5" ry="3.5" fill="#5a4030"/><ellipse cx="6" cy="-2" rx="6.5" ry="3.5" fill="#5a4030"/><g class="upl"><rect x="-20" y="-42" width="8" height="22" rx="4" fill="#4fb3e8"/><circle cx="-16" cy="-19" r="4" fill="#ffd9b8"/></g><g class="upr"><rect x="12" y="-42" width="8" height="22" rx="4" fill="#4fb3e8"/><circle cx="16" cy="-19" r="4" fill="#ffd9b8"/></g><rect x="-14" y="-44" width="28" height="30" rx="10" fill="#4fb3e8"/><circle cy="-58" r="16" fill="#ffd9b8"/><path d="M-16 -58 A16 16 0 0 1 16 -58 Q6 -64 -16 -58Z" fill="#3b2a20"/><circle cx="-6" cy="-56.5" r="2" fill="#333" stroke="none"/><circle cx="6" cy="-56.5" r="2" fill="#333" stroke="none"/><circle cx="-10" cy="-49" r="3" fill="#ff9e9e" stroke="none" opacity=".7"/><circle cx="10" cy="-49" r="3" fill="#ff9e9e" stroke="none" opacity=".7"/><ellipse class="m1" cx="0" cy="-48" rx="2.5" ry="3" fill="#c0392b" stroke-width="1.5"/><path class="m2" d="M-5 -50 q5 8 10 0z" fill="#c0392b" stroke-width="1.5"/></g></g>
