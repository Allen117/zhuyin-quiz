<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.cl{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(22px)}}
.wv{animation:wv 2s ease-in-out infinite alternate}
@keyframes wv{to{transform:translateX(8px)}}
.gull{animation:gull 5s ease-in-out infinite alternate}
@keyframes gull{to{transform:translate(40px,-8px)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes on{from{opacity:0}to{opacity:1}}
@keyframes off{to{opacity:0}}
.up{opacity:0;animation:up 1.2s ease-out both}
@keyframes up{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:1;transform:translateY(-8px)}}
.rays{transform-origin:208px 28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.crab{animation:crab 1.2s ease-in-out infinite alternate}
@keyframes crab{to{transform:translateX(-10px)}}
.raise{transform-origin:13px -44px;animation:raise .6s ease-out 2.5s both}
@keyframes raise{to{transform:rotate(-150deg)}}
.held{opacity:0;animation:on .2s 2.4s forwards}
.eA{animation:off .1s 2.5s forwards}
.eB{opacity:0;animation:on .1s 2.5s forwards}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
