<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.walk{animation:walk 3.4s ease-out both}
@keyframes walk{from{transform:translateX(-70px)}to{transform:translateX(52px)}}
.bob{animation:bob .34s ease-in-out 10 alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.cloud{animation:cloud 8s ease-in-out infinite alternate}
@keyframes cloud{to{transform:translateX(24px)}}
.fly{animation:fly 6s ease-in-out infinite}
@keyframes fly{25%{transform:translate(-20px,-10px)}50%{transform:translate(-40px,2px)}75%{transform:translate(-18px,10px)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap .2s linear infinite alternate}
@keyframes flap{to{transform:scaleX(.3)}}
</style>
