.b4{opacity:0;animation:b4 1.4s cubic-bezier(.2,.8,.4,1) .3s both}
@keyframes b4{0%{opacity:1;transform:none}100%{opacity:1;transform:translate(-15.3px,-39.3px) rotate(348deg)}}
.b5{opacity:0;animation:b5 1.4s cubic-bezier(.2,.8,.4,1) .3s both}
@keyframes b5{0%{opacity:1;transform:none}100%{opacity:1;transform:translate(18.4px,-53.5px) rotate(385deg)}}
