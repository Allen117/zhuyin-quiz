@keyframes b7{0%{opacity:1;transform:none}100%{opacity:1;transform:translate(67.4px,-15.3px) rotate(459deg)}}
.b8{opacity:0;animation:b8 1.4s cubic-bezier(.2,.8,.4,1) .3s both}
@keyframes b8{0%{opacity:1;transform:none}100%{opacity:1;transform:translate(99.6px,1px) rotate(496deg)}}
.b9{opacity:0;animation:b9 1.4s cubic-bezier(.2,.8,.4,1) .3s both}
@keyframes b9{0%{opacity:1;transform:none}100%{opacity:1;transform:translate(70px,30px) rotate(533deg)}}

.aA{animation:off .1s .3s forwards}
.aB{opacity:0;animation:on .1s .3s forwards}
.jump{animation:jump .3s ease-out .3s 6 alternate}
.jump.b{animation-delay:.4s}.jump.c{animation-delay:.35s}
@keyframes jump{to{transform:translateY(-10px)}}
</style>
