<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.drift{animation:drift 7s ease-in-out infinite alternate}
.drift.b{animation-delay:-3.5s}
@keyframes drift{to{transform:translateX(14px)}}
.thumb{transform-box:fill-box;transform-origin:50% 0;animation:thumb .5s ease-out .3s both}
@keyframes thumb{to{transform:rotate(128deg)}}
.nod{transform-box:fill-box;transform-origin:50% 100%;animation:nod .35s ease-in-out 1s 6 alternate}
@keyframes nod{to{transform:translateY(2px) rotate(6deg)}}
.shake{transform-box:fill-box;transform-origin:50% 100%;animation:shake .12s ease-in-out 14 alternate}
@keyframes shake{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.m1{animation:hide .1s 3s forwards}
.m2{opacity:0;animation:show .1s 3s forwards}
@keyframes hide{to{opacity:0}}
@keyframes show{to{opacity:1}}
.heart{opacity:0;animation:rise 1s ease-out 3s both}
@keyframes rise{0%{opacity:0;transform:translate(0,6px) scale(.4)}40%{opacity:1}100%{opacity:1;transform:none}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
