<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
.popc{transform-box:fill-box;transform-origin:50% 50%;animation:pop .45s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.upR{transform-box:fill-box;transform-origin:50% 0;animation:upR .4s ease-out both}
.upL{transform-box:fill-box;transform-origin:50% 0;animation:upL .4s ease-out both}
@keyframes upR{to{transform:rotate(-135deg)}}
@keyframes upL{to{transform:rotate(135deg)}}
.drift{animation:drift 7s ease-in-out infinite alternate}
.drift.b{animation-delay:-3.5s}
@keyframes drift{to{transform:translateX(14px)}}
.ride{animation:ride 1.6s ease-out both}
@keyframes ride{from{transform:translate(-30px,150px)}to{transform:translate(110px,150px)}}
.cheer{transform-box:fill-box;transform-origin:50% 0;animation:cheer 1.8s ease-in-out 1.6s both}
@keyframes cheer{0%{transform:rotate(170deg)}25%{transform:rotate(10deg)}45%,85%{transform:rotate(-15deg)}65%,100%{transform:rotate(15deg)}}
.hop{animation:hop .45s ease-out 1.8s 3}
@keyframes hop{50%{transform:translateY(-12px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
