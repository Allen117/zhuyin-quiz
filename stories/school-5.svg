<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.wave{transform-box:fill-box;transform-origin:100% 0;animation:wave 1.4s ease-in-out both, fadeout .1s 1.5s forwards}
@keyframes wave{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(125deg)}50%{transform:rotate(150deg)}}
.thumb{opacity:0;transform-box:fill-box;transform-origin:100% 100%;animation:pop .5s ease-out 1.5s both}
.star{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:pop .6s ease-out 2.2s both}
.tw{animation:tw .8s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.2}}
.jump{animation:jump .7s ease-in-out 2.9s 2 both}
@keyframes jump{0%,100%{transform:none}40%{transform:translateY(-16px)}}
.eo{animation:fadeout .1s 2.8s forwards}
.ec{opacity:0;animation:fadein .1s 2.8s forwards}
</style>
