<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.walk{animation:walk 1.6s ease-out both}
@keyframes walk{from{transform:translateX(-70px)}to{transform:none}}
.bob{animation:bob .2s ease-in-out 8 alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.reach{transform-box:fill-box;transform-origin:0 100%;animation:reach .5s ease-out 1.7s both}
@keyframes reach{to{transform:translate(4px,-6px)}}
.chew{transform-box:fill-box;transform-origin:30% 90%;animation:chew .2s ease-in-out 2.2s 8 alternate}
@keyframes chew{to{transform:rotate(-3deg)}}
.ml{opacity:0;animation:show .1s 2.2s forwards,gone .2s 3.6s forwards}
.lv{animation:gone .1s 2.2s forwards}
.fall{opacity:0;animation:fall 1.2s ease-in 2.4s both}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(-14px,78px) rotate(200deg)}}
@keyframes gone{to{opacity:0}}
@keyframes show{to{opacity:1}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.cloud{animation:cloud 8s ease-in-out infinite alternate}
@keyframes cloud{to{transform:translateX(24px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
