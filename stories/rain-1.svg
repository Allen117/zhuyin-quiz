<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.cin{animation:cin 1.4s ease-out both}
@keyframes cin{from{transform:translateX(80px)}to{transform:none}}
.rin{opacity:0;animation:show .5s 1.1s forwards}
@keyframes show{to{opacity:1}}
.fall{animation:fall .5s linear infinite}
@keyframes fall{from{transform:translate(3px,-28px)}to{transform:translate(0,0)}}
.point{transform-box:fill-box;transform-origin:50% 0;animation:point .5s ease-out 1.7s both}
@keyframes point{to{transform:rotate(-95deg)}}
.shiv{animation:shiv .08s linear 2.5s 14 alternate}
@keyframes shiv{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.cold{opacity:0;animation:show .3s 2.5s forwards}
.cur{transform-box:fill-box;transform-origin:50% 0;animation:cur 2.5s ease-in-out infinite alternate}
@keyframes cur{to{transform:skewX(4deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
