<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.hop{animation:hop 1.1s both}
@keyframes hop{0%,50%,100%{animation-timing-function:ease-out}0%{transform:translate(0,0)}25%{transform:translate(15px,-22px);animation-timing-function:ease-in}50%{transform:translate(30px,0)}75%{transform:translate(42px,-16px);animation-timing-function:ease-in}100%{transform:translate(54px,0)}}
.chew{transform-box:fill-box;transform-origin:50% 100%;animation:chew .2s ease-in-out 1.3s 10 alternate}
@keyframes chew{to{transform:rotate(5deg)}}
.teeth{transform-box:fill-box;transform-origin:50% 0;animation:teeth .2s ease-in-out 1.3s 10 alternate}
@keyframes teeth{to{transform:scaleY(.4)}}
.l1{animation:gone .2s 1.8s forwards}.l2{animation:gone .2s 2.5s forwards}.l3{animation:gone .2s 3.2s forwards}
@keyframes gone{to{opacity:0}}
@keyframes show{to{opacity:1}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 1.2s ease-in-out infinite alternate}
@keyframes ear{to{transform:rotate(-10deg)}}
.heart{opacity:0;animation:rise 2s ease-out infinite}
.heart.a{animation-delay:3.4s}.heart.b{animation-delay:4.1s}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(6px,-30px) scale(1.1)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#e8f7d8" stroke="none"/>
<rect y="140" width="240" height="28" fill="#9fd36b" stroke="none"/>
<g class="sway"><circle cx="214" cy="136" r="16" fill="#6cc055"/><circle cx="234" cy="140" r="12" fill="#5fb04a"/></g>
<g transform="translate(156 146) scale(1.15)"><path d="M-8 0 q-2 -14 -6 -22 M0 0 v-26 M8 0 q2 -14 6 -22" stroke="#f3f7e8" stroke-width="7"/><path d="M-8 0 q-2 -14 -6 -22 M0 0 v-26 M8 0 q2 -14 6 -22" stroke="#3a3a3a" stroke-width="1" fill="none" opacity=".4"/><g class="l1"><path d="M-14 -18 q-16 -10 -10 -30 q14 4 12 26z" fill="#6cc055"/></g><g class="l2"><path d="M14 -18 q16 -10 10 -30 q-14 4 -12 26z" fill="#6cc055"/></g><g class="l3"><path d="M0 -22 q-12 -16 0 -36 q12 20 0 36z" fill="#7fd36a"/></g><path d="M-14 0 h28 l-3 4 h-22z" fill="#f3f7e8"/></g>
<g class="hop"><g transform="translate(60 148) scale(1.6)"><circle cx="-16" cy="-10" r="6" fill="#fff"/><ellipse cy="-15" rx="17" ry="15" fill="#fff"/><ellipse cx="9" cy="-2" rx="8" ry="3.5" fill="#fff"/><g class="chew"><g class="ear"><ellipse cx="-5" cy="-54" rx="5" ry="14" fill="#fff"/><ellipse cx="-5" cy="-54" rx="2.5" ry="10" fill="#ffc0cb" stroke="none"/></g><g transform="rotate(18 7 -44)"><ellipse cx="7" cy="-56" rx="5" ry="14" fill="#fff"/><ellipse cx="7" cy="-56" rx="2.5" ry="10" fill="#ffc0cb" stroke="none"/></g><circle cx="3" cy="-35" r="13" fill="#fff"/><circle cx="-2" cy="-37" r="1.8" fill="#333" stroke="none"/><circle cx="8" cy="-37" r="1.8" fill="#333" stroke="none"/><circle cx="-5" cy="-31" r="2.4" fill="#ff9e9e" stroke="none" opacity=".8"/><circle cx="12" cy="-31" r="2.4" fill="#ff9e9e" stroke="none" opacity=".8"/><path d="M1.5 -33 h4 l-2 2.5z" fill="#ff8fab" stroke-width="1.2"/><g class="teeth"><rect x="1.5" y="-29" width="4" height="3.5" fill="#fff" stroke-width="1.1"/></g><path d="M3.5 -30.5 q-2 2 -4 1 M3.5 -30.5 q2 2 4 1" fill="none" stroke-width="1.2"/></g></g></g>
<path class="heart a" d="M126 70c-3-5-10-2-7 3l7 7l7-7c3-5-4-8-7-3z" fill="#ff6b8a" stroke-width="1.2"/><path class="heart b" d="M144 62c-3-5-10-2-7 3l7 7l7-7c3-5-4-8-7-3z" fill="#ff6b8a" stroke-width="1.2"/>
<g fill="#ff8fb1" stroke-width="1.2"><circle cx="30" cy="152" r="3"/><circle cx="120" cy="158" r="3"/></g>
</g></svg>
