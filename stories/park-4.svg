<g fill="#7fbf4f" stroke="none"><path d="M40 150 l3 -6 l3 6M90 160 l3 -6 l3 6M150 158 l3 -6 l3 6"/></g>
<rect x="216" y="40" width="7" height="110" rx="2" fill="#9aa4ad"/>
<rect x="186" y="30" width="36" height="26" rx="3" fill="#fff"/><rect x="196" y="40" width="16" height="12" fill="none" stroke="#e74c3c" stroke-width="1.6"/>
<g class="bx"><g class="by"><g class="drop"><circle cx="134" cy="66" r="8" fill="#ff8a3d"/><path d="M126 66 h16 M134 58 v16" fill="none" stroke-width="1.4"/></g></g></g>
<path d="M192 60 l3 18 h14 l3 -18 M198 60 l1 18 M206 60 l-1 18 M193 68 h18" fill="none" stroke="#fff" stroke-width="1.6"/>
<path d="M192 60 l3 18 h14 l3 -18" fill="none" stroke="#bbb" stroke-width="1"/>
<ellipse cx="202" cy="60" rx="11" ry="3" fill="none" stroke="#ff6a00" stroke-width="3"/>
<g class="run"><g class="bob"><g class="cheer"><g transform="translate(134 148) scale(1.1)"><rect x="-10" y="-18" width="8" height="16" rx="3" fill="#4a6fa5"/><rect x="2" y="-18" width="8" height="16" rx="3" fill="#4a6fa5"/><ellipse cx="-6" cy="-2" rx="6.5" ry="3.5" fill="#5a4030"/><ellipse cx="6" cy="-2" rx="6.5" ry="3.5" fill="#5a4030"/><g class="upl"><rect x="-20" y="-42" width="8" height="22" rx="4" fill="#4fb3e8"/><circle cx="-16" cy="-19" r="4" fill="#ffd9b8"/></g><g class="upr"><rect x="12" y="-42" width="8" height="22" rx="4" fill="#4fb3e8"/><circle cx="16" cy="-19" r="4" fill="#ffd9b8"/></g><rect x="-14" y="-44" width="28" height="30" rx="10" fill="#4fb3e8"/><circle cy="-58" r="16" fill="#ffd9b8"/><path d="M-16 -58 A16 16 0 0 1 16 -58 Q6 -64 -16 -58Z" fill="#3b2a20"/><circle cx="-6" cy="-55" r="2" fill="#333" stroke="none"/><circle cx="6" cy="-55" r="2" fill="#333" stroke="none"/><circle cx="-10" cy="-49" r="3" fill="#ff9e9e" stroke="none" opacity=".7"/><circle cx="10" cy="-49" r="3" fill="#ff9e9e" stroke="none" opacity=".7"/><path class="m1" d="M-4 -49 q4 4 8 0" fill="none" stroke-width="1.5"/><path class="m2" d="M-5 -50 q5 8 10 0z" fill="#c0392b" stroke-width="1.5"/><g class="held"><circle cx="22" cy="-22" r="8" fill="#ff8a3d"/><path d="M14 -22 h16 M22 -30 v16" fill="none" stroke-width="1.4"/></g></g></g></g></g>
</g></svg>
