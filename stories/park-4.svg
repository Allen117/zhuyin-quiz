<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.run{animation:run 1.8s ease-out both}
@keyframes run{from{transform:translateX(-80px)}to{transform:none}}
.bob{animation:bob .18s ease-in-out 10 alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.held{animation:gone .05s 2s forwards}
@keyframes gone{to{opacity:0}}
.upl{transform-box:fill-box;transform-origin:50% 0;animation:upl .3s ease-out 1.8s both}
@keyframes upl{to{transform:rotate(160deg)}}
.upr{transform-box:fill-box;transform-origin:50% 0;animation:upr .3s ease-out 1.8s both}
@keyframes upr{to{transform:rotate(-160deg)}}
.bx{opacity:0;animation:show .05s 2s forwards,bx 1s linear 2s forwards}
@keyframes show{to{opacity:1}}
@keyframes bx{to{transform:translateX(70px)}}
.by{animation:by 1s 2s both}
@keyframes by{0%{transform:translateY(0);animation-timing-function:ease-out}55%{transform:translateY(-34px);animation-timing-function:ease-in}100%{transform:translateY(-6px)}}
.drop{animation:drop .4s ease-in 3s both}
@keyframes drop{to{transform:translateY(34px)}}
.cheer{animation:cheer .25s ease-out 3.3s 4 alternate}
@keyframes cheer{to{transform:translateY(-14px)}}
.m1{animation:gone .05s 3.3s forwards}
.m2{opacity:0;animation:show .05s 3.3s forwards}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.cloud{animation:cloud 8s ease-in-out infinite alternate}
@keyframes cloud{to{transform:translateX(24px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#d6efff" stroke="none"/>
<path class="cloud" d="M24 24 q4 -12 18 -8 q10 -10 22 0 q12 0 10 10 h-46 q-8 -2 -4 -2z" fill="#fff"/><path class="cloud" d="M110 34 q4 -12 18 -8 q10 -10 22 0 q12 0 10 10 h-46 q-8 -2 -4 -2z" fill="#fff"/>
<rect y="122" width="240" height="46" fill="#9fd36b" stroke="none"/>
<path d="M0 122 H240" stroke="#7fbf4f" stroke-width="2"/>
