<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{transform-origin:30px 28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.walk{animation:walk 3.4s ease-in-out both}
@keyframes walk{from{transform:translateX(-70px)}to{transform:translateX(70px)}}
.waddle{transform-box:fill-box;transform-origin:50% 100%;animation:waddle .3s ease-in-out 11 alternate}
@keyframes waddle{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.splash{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:splash .6s ease-out 3.4s both}
@keyframes splash{0%{opacity:0;transform:scale(.2)}50%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
</style>
