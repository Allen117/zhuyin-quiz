<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.walk{animation:walk 3.2s ease-out both}
@keyframes walk{from{transform:translate(-60px,0)}to{transform:translate(118px,0)}}
.bob{animation:bob .4s ease-in-out 8 alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.wave{transform-box:fill-box;transform-origin:50% 10%;animation:wave 2.2s ease-in-out 3.3s both}
@keyframes wave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-120deg)}40%,80%{transform:rotate(-150deg)}}
.rays{transform-origin:30px 28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fly{animation:fly 6s ease-in-out infinite}
@keyframes fly{25%{transform:translate(30px,-14px)}50%{transform:translate(64px,2px)}75%{transform:translate(28px,12px)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap .2s linear infinite alternate}
@keyframes flap{to{transform:scaleX(.3)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
