.hop{animation:hop .5s ease-out 2}
@keyframes hop{50%{transform:translateY(-12px)}}
.drift{animation:drift 7s ease-in-out infinite alternate}
.drift.b{animation-delay:-3.5s}
@keyframes drift{to{transform:translateX(14px)}}
