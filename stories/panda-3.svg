<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.walk{animation:walk 2.6s ease-out both,gone .4s 2.7s forwards}
@keyframes walk{from{transform:translate(-50px,0)}to{transform:translate(100px,0)}}
@keyframes gone{to{opacity:0}}
.bob{animation:bob .35s ease-in-out 8 alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.in{opacity:0;animation:fade .5s 2.9s forwards}
@keyframes fade{to{opacity:1}}
.blanket{animation:drop .6s ease-out 3.2s both}
@keyframes drop{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
.dark{opacity:0;animation:dim 1.2s 4.2s forwards}
@keyframes dim{to{opacity:.45}}
.lamp{animation:off .1s 4.2s forwards}
@keyframes off{to{fill:#b0a690}}
</style>
