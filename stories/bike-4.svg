<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.waveR{transform-box:fill-box;transform-origin:50% 0;animation:waveR 2s ease-in-out both}
@keyframes waveR{0%{transform:rotate(0)}20%{transform:rotate(-140deg)}35%,65%{transform:rotate(-168deg)}50%,80%{transform:rotate(-125deg)}100%{transform:rotate(-150deg)}}
.waveL{transform-box:fill-box;transform-origin:50% 0;animation:waveL 2s ease-in-out both}
@keyframes waveL{0%{transform:rotate(0)}20%{transform:rotate(140deg)}35%,65%{transform:rotate(168deg)}50%,80%{transform:rotate(125deg)}100%{transform:rotate(150deg)}}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
.popc{transform-box:fill-box;transform-origin:50% 50%;animation:pop .45s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.drift{animation:drift 7s ease-in-out infinite alternate}
.drift.b{animation-delay:-3.5s}
@keyframes drift{to{transform:translateX(14px)}}
.ride{animation:ride 1.4s ease-out both}
@keyframes ride{from{transform:translate(120px,152px)}to{transform:translate(178px,152px)}}
.look{animation:look .3s ease-out 1.4s both}
@keyframes look{to{transform:translateX(-6px)}}
.m1{animation:hide .1s 2s forwards}
.m2{opacity:0;animation:show .1s 2s forwards}
@keyframes hide{to{opacity:0}}
@keyframes show{to{opacity:1}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
