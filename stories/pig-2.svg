<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.brush{animation:brush .2s ease-in-out 8 alternate both, fadeout .1s 1.8s forwards}
@keyframes brush{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
.foam{opacity:0;animation:fadein .3s .4s forwards, fadeout .1s 1.8s forwards}
.walk{animation:walk 1.1s ease-in-out 2s both}
@keyframes walk{to{transform:translateX(114px)}}
.bob{animation:bob .2s ease-in-out 2s 6 alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.chew{animation:chew .3s ease-in-out 3.2s 6 alternate}
@keyframes chew{to{transform:translateY(3px)}}
.bite{animation:bite 1.6s steps(3,end) 3.3s both}
@keyframes bite{to{transform:scale(.25);opacity:0}}
.bite{transform-box:fill-box;transform-origin:50% 100%}
</style>
