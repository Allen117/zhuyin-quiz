<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.plane{animation:plane 4s linear both}
@keyframes plane{from{transform:translate(-60px,14px)}to{transform:translate(290px,-8px)}}
.trail{transform-box:fill-box;transform-origin:0 50%;animation:trail 4s linear both}
@keyframes trail{from{transform:scaleX(0)}to{transform:none}}
.point{transform-box:fill-box;transform-origin:0 0;animation:point .6s ease-out .6s both}
@keyframes point{to{transform:rotate(-140deg)}}
.point2{transform-box:fill-box;transform-origin:0 0;animation:point2 .6s ease-out 1.4s both}
@keyframes point2{to{transform:rotate(-130deg)}}
</style>
