<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.note{opacity:0;animation:note 1.2s ease-out both}
@keyframes note{0%{opacity:0;transform:translate(0,12px) scale(.4)}30%{opacity:1}100%{opacity:1;transform:translate(0,-6px) scale(1)}}
.drift{animation:drift 7s ease-in-out infinite alternate}
.drift.b{animation-delay:-3.5s}
@keyframes drift{to{transform:translateX(14px)}}
.graze{transform-box:fill-box;transform-origin:50% 50%;animation:graze .6s ease-in-out 5 alternate both}
@keyframes graze{from{transform:rotate(0)}to{transform:rotate(42deg)}}
.leaves{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.rock{transform-box:fill-box;transform-origin:50% 100%;animation:rock .5s ease-in-out 7 alternate}
@keyframes rock{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
</style>
