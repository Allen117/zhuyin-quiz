<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.wv{animation:wv 3s linear infinite}
@keyframes wv{to{transform:translateX(-40px)}}
.bobw{animation:bobw 1.6s ease-in-out infinite alternate}
@keyframes bobw{to{transform:translateY(2px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.cloud{animation:cloud 8s ease-in-out infinite alternate}
@keyframes cloud{to{transform:translateX(24px)}}
.talk{transform-box:fill-box;transform-origin:50% 0;animation:talk .2s ease-in-out 12 alternate}
@keyframes talk{to{transform:scaleY(.4)}}
.pt{transform-box:fill-box;transform-origin:50% 0;animation:pt .5s ease-out .3s both}
@keyframes pt{to{transform:rotate(145deg)}}
.hop{animation:hop 1.3s ease-in-out 1s both}
@keyframes hop{0%,100%{transform:none}35%,65%{transform:translate(-16px,-26px)}}
.tilt{transform-box:fill-box;transform-origin:50% 100%;animation:tilt .5s ease-in-out 2.5s 2 alternate}
@keyframes tilt{to{transform:rotate(-12deg)}}
.nod{animation:nod .2s ease-in-out 3.5s 4 alternate}
@keyframes nod{to{transform:translateY(3px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
