<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw 1.4s ease-in-out infinite alternate}
.tw.b{animation-delay:-.7s}
@keyframes tw{to{transform:scale(.45);opacity:.5}}
.dusk{opacity:0;animation:dusk 1.6s ease-out forwards}
@keyframes dusk{to{opacity:1}}
.moon{animation:moon 1.6s ease-out both}
@keyframes moon{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.wind{stroke-dasharray:90;stroke-dashoffset:90;animation:wind 1.2s ease-out both}
@keyframes wind{0%{stroke-dashoffset:90;opacity:0}20%{opacity:1}100%{stroke-dashoffset:0;opacity:.85}}
.leaf{animation:leaf 2.2s ease-in-out both}
@keyframes leaf{0%{transform:translate(-30px,0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(250px,-20px) rotate(540deg);opacity:1}}
.breeze{transform-box:fill-box;transform-origin:50% 100%;animation:breeze .6s ease-in-out 1s 4 alternate}
@keyframes breeze{to{transform:rotate(-4deg)}}
</style>
