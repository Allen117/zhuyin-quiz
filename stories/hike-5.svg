<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.jump{animation:jump .8s ease-in-out .1s 2 both}
@keyframes jump{0%,100%{transform:none}45%{transform:translateY(-18px)}}
.cheerl{transform-box:fill-box;transform-origin:100% 0;animation:cl .5s ease-out .1s both}
.cheerr{transform-box:fill-box;transform-origin:0 0;animation:cr .5s ease-out .1s both}
@keyframes cl{to{transform:rotate(130deg)}}
@keyframes cr{to{transform:rotate(-130deg)}}
.say{opacity:0;animation:say 1.4s ease-out .4s both}
.say.b{animation-delay:.7s}
@keyframes say{0%{opacity:0;transform:none}25%,70%{opacity:1}100%{opacity:0;transform:translateX(-12px)}}
.down{animation:fadeout .1s 2s forwards}
.thumb{opacity:0;transform-box:fill-box;transform-origin:0 100%;animation:pop .5s ease-out 2s both}
.nod{animation:nod .8s ease-in-out 2.5s both}
@keyframes nod{0%,100%{transform:none}25%,75%{transform:translateY(4px)}50%{transform:none}}
.s{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:pop .5s ease-out both}
.s0{animation-delay:3.1s}.s1{animation-delay:3.4s}.s2{animation-delay:3.7s}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flag 1s ease-in-out infinite alternate}
@keyframes flag{to{transform:skewY(8deg) scaleX(.9)}}
</style>
