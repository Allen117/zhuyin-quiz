<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.chomp{animation:chomp .5s ease-in-out 6 alternate,gone .4s 3s forwards}
@keyframes chomp{to{transform:translate(-5px,-6px)}}
@keyframes gone{to{opacity:0}}
.mouth{transform-box:fill-box;transform-origin:50% 0;animation:open .5s ease-in-out 6 alternate,shut .1s 3s forwards}
@keyframes open{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@keyframes shut{to{opacity:0}}
.smile{opacity:0;animation:show .1s 3s forwards}
.cake{transform-box:fill-box;transform-origin:50% 100%;animation:pop .6s cubic-bezier(.3,1.6,.6,1) 3.3s both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.arm2{opacity:0;animation:show .1s 3s forwards}
@keyframes show{to{opacity:1}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .3s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.8,1.15)}}
.heart{opacity:0;animation:rise 2s ease-out infinite}
.heart.a{animation-delay:4.2s}.heart.b{animation-delay:4.9s}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(6px,-34px) scale(1.1)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
