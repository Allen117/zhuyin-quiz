<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.cl{animation:drift 7s ease-in-out infinite alternate}
.cl.b{animation-delay:-3.5s}
@keyframes drift{to{transform:translateX(26px)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes on{from{opacity:0}to{opacity:1}}
@keyframes off{to{opacity:0}}
.rays{transform-origin:28px 26px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.cA{transform-origin:-13px -44px;animation:cA .3s ease-in-out 9 alternate both}
@keyframes cA{from{transform:rotate(55deg)}to{transform:rotate(0)}}
.cB{transform-origin:13px -44px;animation:cB .3s ease-in-out 9 alternate both}
@keyframes cB{from{transform:rotate(-55deg)}to{transform:rotate(0)}}
.sp{animation:sp .3s ease-in 9 alternate both}
@keyframes sp{from{opacity:0}to{opacity:1}}
.sh{animation:on .3s .2s both}
.hop{animation:hop .3s ease-out 2.8s 4 alternate}
@keyframes hop{to{transform:translateY(-9px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
