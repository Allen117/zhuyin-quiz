<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.tw{animation:tw 1.6s ease-in-out infinite alternate}
.tw.b{animation-delay:-.8s}.tw.c{animation-delay:-.4s}
@keyframes tw{to{opacity:.2}}
.glow{transform-box:fill-box;transform-origin:50% 50%;animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.2);opacity:.06}}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 2.4s ease-in-out infinite}
@keyframes breath{50%{transform:scaleY(1.08)}}
.nod{animation:nod 2.4s ease-in-out infinite}
@keyframes nod{50%{transform:translateY(-1.5px)}}
.z{opacity:0;animation:z 3.6s ease-out infinite}
.z.b{animation-delay:1.2s}.z.c{animation-delay:2.4s}
@keyframes z{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(16px,-40px) scale(1.3)}}
</style>
