<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.wv{animation:wv 3s linear infinite}
@keyframes wv{to{transform:translateX(-40px)}}
.bobw{animation:bobw 1.6s ease-in-out infinite alternate}
@keyframes bobw{to{transform:translateY(2px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.cloud{animation:cloud 8s ease-in-out infinite alternate}
@keyframes cloud{to{transform:translateX(24px)}}
.lm{animation:laugh .2s ease-in-out .2s 14 alternate}
.lg{animation:laugh .2s ease-in-out .35s 14 alternate}
@keyframes laugh{to{transform:translateY(-4px)}}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.heart{opacity:0;animation:rise 2s ease-out infinite}
.heart.a{animation-delay:1.2s}.heart.b{animation-delay:2s}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(6px,-30px) scale(1.1)}}
.tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw .9s ease-in-out infinite alternate}
.tw.x{animation-delay:-.45s}
@keyframes tw{from{transform:scale(.5)}to{transform:scale(1.1)}}
.rays{transform-origin:212px 28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
