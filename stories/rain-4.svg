<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.fall{animation:fall .5s linear infinite}
@keyframes fall{from{transform:translate(3px,-28px)}to{transform:translate(0,0)}}
.j1{animation:j1 1s .2s both}
@keyframes j1{0%{transform:translate(0,0);animation-timing-function:ease-out}50%{transform:translate(22px,-40px);animation-timing-function:ease-in}100%{transform:translate(44px,0)}}
.j2{animation:j2 1s 1.7s both}
@keyframes j2{0%{transform:translate(0,0);animation-timing-function:ease-out}50%{transform:translate(-24px,-40px);animation-timing-function:ease-in}100%{transform:translate(-48px,0)}}
.s1{transform-origin:92px 148px;animation:burst .45s ease-out 1.2s both,gone .4s 1.8s forwards}
.s2{transform-origin:154px 148px;animation:burst .45s ease-out 2.7s both,gone .4s 3.3s forwards}
@keyframes burst{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes gone{to{opacity:0}}
</style>
