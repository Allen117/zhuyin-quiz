<style>
.chop{animation:chop 1.5s ease-in-out 2 both}
@keyframes chop{0%{transform:translate(132px,100px)}45%,60%{transform:translate(126px,80px)}100%{transform:translate(132px,100px)}}
.open{opacity:0;transform-box:fill-box;transform-origin:50% 0;animation:op 1.5s ease-out 2 both}
@keyframes op{0%,20%{opacity:0;transform:scaleY(.2)}40%,60%{opacity:1;transform:none}75%,100%{opacity:0;transform:scaleY(.2)}}
.munch{animation:munch .2s ease-in-out 3s 6 alternate}
@keyframes munch{to{transform:translateY(2px)}}
.yum{opacity:0;animation:yum .6s ease-out 3.2s forwards}
@keyframes yum{to{opacity:1}}
</style>
