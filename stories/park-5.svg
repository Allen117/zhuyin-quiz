<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.walk{animation:walk 3s ease-out both}
@keyframes walk{from{transform:translateX(-60px)}to{transform:translateX(34px)}}
.bob{animation:bob .42s ease-in-out 7 alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.sweat{animation:sweat .8s ease-in 4 both}
@keyframes sweat{from{transform:none;opacity:1}to{transform:translateY(8px);opacity:0}}
.lit{animation:lit .3s 3.1s forwards}
@keyframes lit{to{fill:#ffe066}}
.glow{opacity:0;animation:show .4s 3.1s forwards}
@keyframes show{to{opacity:.5}}
.bird{animation:bird 6s ease-in-out infinite alternate}
@keyframes bird{to{transform:translate(-30px,6px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
</style>
