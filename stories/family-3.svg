<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
.popc{transform-box:fill-box;transform-origin:50% 50%;animation:pop .45s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.paint{transform-box:fill-box;transform-origin:50% 0;animation:paint .3s ease-in-out 8 alternate}
@keyframes paint{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.stem{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.leaf{opacity:0;animation:show .3s .7s forwards}
@keyframes show{to{opacity:1}}
</style>
