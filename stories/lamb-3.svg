<style>
.fall{animation:fall .5s linear infinite}
@keyframes fall{from{transform:translate(0,-20px)}to{transform:translate(-6px,20px)}}
.gwalk{animation:gwalk 2s ease-out both}
@keyframes gwalk{from{transform:translateX(110px)}to{transform:none}}
.bob{animation:bob .3s ease-in-out 6 alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.umb{transform-box:view-box;transform-origin:0 0;animation:umb 1.2s ease-in-out 2.2s both}
@keyframes umb{from{transform:rotate(10deg)}to{transform:rotate(-14deg)}}
.look{animation:off .1s 3.4s forwards}
.happy{opacity:0;animation:on .1s 3.4s forwards}
@keyframes off{to{opacity:0}}
@keyframes on{to{opacity:1}}
</style>
