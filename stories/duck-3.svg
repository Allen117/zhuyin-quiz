<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{transform-origin:30px 28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:ripple .9s ease-out .6s 2 both}
@keyframes ripple{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(2.5)}}
.shiver{animation:dip 1.2s ease-in-out both,shiver .08s linear 1.4s 24 alternate}
@keyframes dip{0%{transform:none}40%{transform:translate(14px,4px) rotate(8deg)}100%{transform:none}}
@keyframes shiver{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.cold{opacity:0;animation:fade .4s 1.4s forwards}
@keyframes fade{to{opacity:1}}
.drop{opacity:0;animation:drop 1.4s ease-in 1.6s forwards}
@keyframes drop{0%{opacity:1}100%{opacity:1;transform:translateY(16px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#d6efff" stroke="none"/>
<g class="rays" stroke="#f5b400" stroke-width="2.5"><path d="M30 6v6M30 44v6M8 28h6M46 28h6M14 12l4 4M42 40l4 4M14 44l4-4M42 16l4-4"/></g>
<circle cx="30" cy="28" r="11" fill="#ffd54f"/>
<rect y="126" width="110" height="42" fill="#9fd36b" stroke="none"/>
<path d="M104 128Q124 120 250 122V170H96Z" fill="#6ec6f0" stroke="#3a8fc0"/>
<g transform="translate(90 130)"><g class="shiver"><g transform="scale(1.3)"><path d="M-6 -2l-4 4h8zM6 -2l-4 4h8z" fill="#ff9800" stroke-width="1.5"/>
<path d="M-24 -26q-6 -6 -2 -10q6 6 10 6z" fill="#ffe14d"/>
<ellipse cx="0" cy="-16" rx="24" ry="15" fill="#ffe14d"/>
<path d="M12 -24Q10 -34 14 -40" fill="none" stroke="#ffe14d" stroke-width="10"/>
<circle cx="16" cy="-42" r="12" fill="#ffe14d"/>
<path d="M12 -26Q9 -32 10 -36M22 -32Q20 -28 18 -24" fill="none" stroke="#ffe14d" stroke-width="6"/>
<path d="M26 -44q10 0 12 3q-4 4-12 2z" fill="#ff9800"/>
<circle cx="19" cy="-45" r="2.2" fill="#2b2b2b" stroke="none"/>
<circle cx="16" cy="-38" r="2.4" fill="#ffb3b3" stroke="none"/>
<g class="wing s"><path d="M-12 -20q12 -8 22 0q-8 12 -22 0z" fill="#ffe14d"/></g></g></g></g>
<g class="ripple"><ellipse cx="124" cy="132" rx="8" ry="3" fill="none" stroke="#fff"/></g>
<g class="cold" fill="none" stroke="#5aa9e6" stroke-width="2.5"><path d="M40 70q-6 4 0 8t0 8M118 66q6 4 0 8t0 8M48 52l-6-4M110 50l6-4"/></g>
<g class="drop"><path d="M100 72q-5 8 0 10q5-2 0-10z" fill="#9ed8ff" stroke="#3a8fc0" stroke-width="1.5"/></g>
</g></svg>
