<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.run{animation:run 2.4s cubic-bezier(.5,0,.3,1) .3s both}
@keyframes run{from{transform:translate(178px,150px)}to{transform:translate(40px,150px)}}
.gal{animation:gal .18s ease-in-out .3s 13 alternate}
@keyframes gal{to{transform:translateY(-6px) rotate(-4deg)}}
.puff{opacity:0;animation:puff .8s ease-out both}
@keyframes puff{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.sweat{opacity:0;animation:show .3s 2.5s forwards}
@keyframes show{to{opacity:1}}
.lines{opacity:0;animation:lines 2.2s ease-in-out .4s both}
@keyframes lines{10%,80%{opacity:1}100%{opacity:0}}
</style>
