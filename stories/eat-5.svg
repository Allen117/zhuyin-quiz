<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.tilt{transform-box:fill-box;transform-origin:50% 100%;animation:tilt .4s ease-in-out .1s 2 alternate}
@keyframes tilt{to{transform:rotate(-10deg)}}
.p1{transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.3,1.6,.6,1) 1s both}
.p2{transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.3,1.6,.6,1) 1.6s both}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.jump{animation:jump .28s ease-out 2.3s 4 alternate}
@keyframes jump{to{transform:translateY(-14px)}}
.upl{transform-box:fill-box;transform-origin:50% 0;animation:upl .3s ease-out 2.2s both}
@keyframes upl{to{transform:rotate(145deg)}}
.upr{transform-box:fill-box;transform-origin:50% 0;animation:upr .3s ease-out 2.2s both}
@keyframes upr{to{transform:rotate(-145deg)}}
.m1{animation:gone .05s 2.2s forwards}
.m2{opacity:0;animation:show .05s 2.2s forwards}
@keyframes gone{to{opacity:0}}
@keyframes show{to{opacity:1}}
.heart{opacity:0;animation:rise 2s ease-out infinite}
.heart.a{animation-delay:2.6s}.heart.b{animation-delay:3.3s}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(6px,-30px) scale(1.1)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#fff0e0" stroke="none"/>
<rect y="124" width="240" height="44" fill="#d9a873" stroke="none"/>
