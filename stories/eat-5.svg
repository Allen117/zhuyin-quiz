<rect x="176" y="22" width="44" height="34" rx="4" fill="#ffe0b2"/><path d="M186 46 q12 -18 24 0z" fill="#8bcf5a" stroke-width="1.5"/>
<g class="jump"><g class="tilt"><g transform="translate(120 150) scale(1.25)"><rect x="-10" y="-18" width="8" height="16" rx="3" fill="#4a6fa5"/><rect x="2" y="-18" width="8" height="16" rx="3" fill="#4a6fa5"/><ellipse cx="-6" cy="-2" rx="6.5" ry="3.5" fill="#5a4030"/><ellipse cx="6" cy="-2" rx="6.5" ry="3.5" fill="#5a4030"/><g class="upl"><rect x="-20" y="-42" width="8" height="22" rx="4" fill="#ff8a65"/><circle cx="-16" cy="-19" r="4" fill="#ffd9b8"/></g><g class="upr"><rect x="12" y="-42" width="8" height="22" rx="4" fill="#ff8a65"/><circle cx="16" cy="-19" r="4" fill="#ffd9b8"/></g><rect x="-14" y="-44" width="28" height="30" rx="10" fill="#ff8a65"/><circle cy="-58" r="16" fill="#ffd9b8"/><path d="M-16 -58 A16 16 0 0 1 16 -58 Q6 -64 -16 -58Z" fill="#3b2a20"/><circle cx="-6" cy="-55" r="2" fill="#333" stroke="none"/><circle cx="6" cy="-55" r="2" fill="#333" stroke="none"/><circle cx="-10" cy="-49" r="3" fill="#ff9e9e" stroke="none" opacity=".7"/><circle cx="10" cy="-49" r="3" fill="#ff9e9e" stroke="none" opacity=".7"/><path class="m1" d="M-4 -49 q4 4 8 0" fill="none" stroke-width="1.5"/><path class="m2" d="M-5 -50 q5 8 10 0z" fill="#c0392b" stroke-width="1.5"/></g></g></g>
<ellipse cx="54" cy="150" rx="30" ry="6" fill="#fff"/>
