<g class="p2"><g transform="translate(186 144) scale(1.3)"><path d="M0 -16 C-8 -24 -22 -18 -20 -4 C-18 10 -8 14 0 10 C8 14 18 10 20 -4 C22 -18 8 -24 0 -16z" fill="#e53935"/><path d="M0 -16 q0 -6 3 -10" fill="none" stroke="#7a5640" stroke-width="2.5"/><path d="M3 -22 q8 -6 12 0 q-6 5 -12 0z" fill="#6cc055" stroke-width="1.5"/><ellipse cx="-9" cy="-8" rx="3" ry="5" fill="#fff" opacity=".45" stroke="none"/></g></g>
<path class="heart a" d="M54 92c-3-5-10-2-7 3l7 7l7-7c3-5-4-8-7-3z" fill="#ff6b8a" stroke-width="1.2"/><path class="heart b" d="M186 92c-3-5-10-2-7 3l7 7l7-7c3-5-4-8-7-3z" fill="#ff6b8a" stroke-width="1.2"/>
</g></svg>
