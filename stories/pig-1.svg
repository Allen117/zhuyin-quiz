<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.dark{opacity:.55;animation:fadeout 1.4s ease-in .3s forwards}
.glass{animation:day 1.4s .3s forwards}
@keyframes day{to{fill:#bfe6ff}}
.wsun{opacity:0;animation:fadein 1s .9s forwards}
.ring{transform-box:fill-box;transform-origin:50% 100%;animation:ring .1s linear .2s 12 alternate both}
@keyframes ring{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.rl{opacity:0;animation:blink .2s .2s 6 alternate both}
@keyframes blink{to{opacity:1}}
.ec{animation:fadeout .1s 1.5s forwards}
.eo{opacity:0;animation:fadein .1s 1.5s forwards}
.up{animation:up .6s ease-out 1.8s both}
@keyframes up{to{transform:translateY(-26px)}}
.stl{transform-box:fill-box;transform-origin:50% 10%;animation:stl 1.4s ease-in-out 2.5s both}
.str{transform-box:fill-box;transform-origin:50% 10%;animation:str 1.4s ease-in-out 2.5s both}
@keyframes stl{0%,100%{transform:none}30%,70%{transform:rotate(160deg)}}
@keyframes str{0%,100%{transform:none}30%,70%{transform:rotate(-160deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
