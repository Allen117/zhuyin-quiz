<g class="gin"><g transform="translate(150 146) scale(1.1)"><ellipse cx="-7" cy="-2" rx="6.5" ry="3.5" fill="#5a4030"/><ellipse cx="7" cy="-2" rx="6.5" ry="3.5" fill="#5a4030"/><path d="M-17 -4 L-13 -34 h26 L17 -4z" fill="#8e6cc0"/><rect x="-42" y="-54" width="28" height="8" rx="4" fill="#c49bd8"/><g class="swing"><path d="M-53 -42 l-8 15 l6 2 l5 -10z M-33 -42 l8 15 l-6 2 l-5 -10z" fill="#ffd23f"/><path d="M-53 -44 h20 l6 34 h-32z" fill="#ffd23f"/><circle cx="-43" cy="-48" r="8" fill="#ffd23f"/><path d="M-43 -42v32" stroke-width="1.5"/><circle cx="-46" cy="-34" r="1.5" fill="#3a3a3a" stroke="none"/><circle cx="-46" cy="-24" r="1.5" fill="#3a3a3a" stroke="none"/></g><circle cx="-42" cy="-50" r="4" fill="#ffd9b8"/><g class="door"><rect x="14" y="-54" width="8" height="24" rx="4" fill="#c49bd8"/><circle cx="18" cy="-29" r="4" fill="#ffd9b8"/></g><rect x="-15" y="-56" width="30" height="26" rx="10" fill="#c49bd8"/><circle cy="-89" r="7" fill="#dcdcdc"/><circle cy="-70" r="16" fill="#ffd9b8"/><path d="M-16 -70 A16 16 0 0 1 16 -70 Q8 -80 0 -77 Q-8 -80 -16 -70z" fill="#dcdcdc"/><circle cx="-6" cy="-67" r="4.5" fill="none" stroke-width="1.5"/><circle cx="6" cy="-67" r="4.5" fill="none" stroke-width="1.5"/><path d="M-1.5 -67h3" stroke-width="1.5"/><circle cx="-6" cy="-67" r="1.6" fill="#333" stroke="none"/><circle cx="6" cy="-67" r="1.6" fill="#333" stroke="none"/><circle cx="-11" cy="-60" r="3" fill="#ff9e9e" stroke="none" opacity=".7"/><circle cx="11" cy="-60" r="3" fill="#ff9e9e" stroke="none" opacity=".7"/><ellipse class="talk" cx="0" cy="-59" rx="2.5" ry="3" fill="#c0392b" stroke-width="1.5"/></g></g>
