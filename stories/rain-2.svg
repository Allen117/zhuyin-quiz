<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.gin{animation:gin 1s ease-out both}
@keyframes gin{from{transform:translateX(34px)}to{transform:none}}
.talk{transform-box:fill-box;transform-origin:50% 0;animation:talk .2s ease-in-out 12 alternate}
@keyframes talk{to{transform:scaleY(.3)}}
.swing{transform-box:fill-box;transform-origin:70% 0;animation:swing .35s ease-in-out 1.1s 4 alternate}
@keyframes swing{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.door{transform-box:fill-box;transform-origin:50% 0;animation:door .5s ease-out 2.5s both}
@keyframes door{to{transform:rotate(-115deg)}}
.nod{animation:nod .22s ease-in-out 3.1s 6 alternate}
@keyframes nod{to{transform:translateY(4px)}}
.happy{opacity:0;animation:show .1s 3.1s forwards}
.plain{animation:gone .1s 3.1s forwards}
@keyframes show{to{opacity:1}}
@keyframes gone{to{opacity:0}}
.fall{animation:fall .5s linear infinite}
@keyframes fall{from{transform:translate(3px,-28px)}to{transform:translate(0,0)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
