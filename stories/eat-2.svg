<g fill="#ffe14d" stroke-width="1.5"><path d="M50 46 q-6 12 2 20 q2 -10 4 -18z"/><path d="M56 46 q0 14 8 18 q-2 -10 -2 -18z"/><path d="M62 44 q6 12 14 14 q-6 -8 -8 -16z"/></g></g>
<g class="sway b"><rect x="200" y="70" width="12" height="74" rx="3" fill="#8a5a3c"/><circle cx="194" cy="66" r="18" fill="#6cc76c"/><circle cx="218" cy="62" r="18" fill="#5cb85c"/></g>
<g transform="translate(126 148) scale(1.5)"><path d="M10 -12 q18 -2 15 -22 q-2 -8 -8 -5" fill="none" stroke="#a0673a" stroke-width="4.5"/><ellipse cx="-8" cy="-6" rx="6" ry="7" fill="#a0673a"/><ellipse cx="8" cy="-6" rx="6" ry="7" fill="#a0673a"/><g><rect x="-20" y="-38" width="7" height="20" rx="3.5" fill="#a0673a"/><circle cx="-16.5" cy="-17" r="4" fill="#e8c39e"/></g><g class="feed"><path d="M14 -32 Q26 -34 24 -42" fill="none" stroke="#3a3a3a" stroke-width="10"/><path d="M14 -32 Q26 -34 24 -42" fill="none" stroke="#a0673a" stroke-width="6.5"/><g class="b1"><path d="M23 -44 L18 -52" stroke="#3a3a3a" stroke-width="10"/><path d="M23 -44 L18 -52" stroke="#ffe14d" stroke-width="6.5"/></g><g class="b2"><path d="M18 -52 L12 -57" stroke="#3a3a3a" stroke-width="10"/><path d="M18 -52 L12 -57" stroke="#ffe14d" stroke-width="6.5"/></g><g class="b3"><path d="M12 -57 L6 -60" stroke="#3a3a3a" stroke-width="10"/><path d="M12 -57 L6 -60" stroke="#ffe14d" stroke-width="6.5"/></g><path d="M23 -44 q-6 6 -10 4 M23 -44 q2 8 -1 12 M23 -44 q8 4 9 10" fill="#ffe14d" stroke-width="1.5"/><circle cx="24" cy="-43" r="4" fill="#e8c39e"/></g><ellipse cy="-24" rx="15" ry="16" fill="#a0673a"/><ellipse cy="-21" rx="9" ry="11" fill="#e8c39e"/><circle cx="-17" cy="-52" r="6" fill="#e8c39e"/><circle cx="17" cy="-52" r="6" fill="#e8c39e"/><circle cy="-52" r="15" fill="#a0673a"/><ellipse cy="-48" rx="11.5" ry="10" fill="#e8c39e"/><path d="M-8 -50 q3 -4 6 0 M2 -50 q3 -4 6 0" fill="none" stroke-width="1.6"/><circle cx="-8" cy="-45" r="2.4" fill="#ff9e9e" stroke="none" opacity=".7"/><circle cx="8" cy="-45" r="2.4" fill="#ff9e9e" stroke="none" opacity=".7"/><g class="sad"><ellipse class="mo" cx="0" cy="-45" rx="3.5" ry="3" fill="#c0392b" stroke-width="1.5"/></g><path class="hp" d="M-5 -46 q5 7 10 0z" fill="#c0392b" stroke-width="1.5"/></g>
