<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.feed{animation:feed .45s ease-in-out .2s 6 alternate}
@keyframes feed{to{transform:translate(-3px,3px)}}
.b3{animation:gone .15s .6s forwards}.b2{animation:gone .15s 1.5s forwards}.b1{animation:gone .15s 2.4s forwards}
@keyframes gone{to{opacity:0}}
@keyframes show{to{opacity:1}}
.mo{transform-box:fill-box;transform-origin:50% 0;animation:mo .2s ease-in-out .2s 14 alternate}
@keyframes mo{to{transform:scaleY(.3)}}
.hp{opacity:0;animation:show .1s 3s forwards}
.sad{animation:gone .1s 3s forwards}
.heart{opacity:0;animation:rise 2s ease-out infinite}
.heart.a{animation-delay:3.1s}.heart.b{animation-delay:3.8s}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(6px,-30px) scale(1.1)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#fff3d6" stroke="none"/>
<rect y="140" width="240" height="28" fill="#c9e59a" stroke="none"/>
