<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.walk{animation:walk 2.4s ease-out both}
@keyframes walk{from{transform:translateX(-24px)}to{transform:translateX(80px)}}
.bob{animation:bob .3s ease-in-out 8 alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.wind{opacity:0;animation:wind 1.8s ease-in-out both}
.wind.b{animation-delay:.6s}.wind.c{animation-delay:1.4s}
@keyframes wind{0%{opacity:0;transform:translateX(0)}20%,80%{opacity:1}100%{opacity:0;transform:translateX(-170px)}}
.petal{opacity:0;animation:petal 2s ease-in-out .8s both}
.petal.b{animation-delay:1.3s}
@keyframes petal{0%{opacity:0;transform:none}15%,85%{opacity:1}100%{opacity:0;transform:translate(-150px,-30px) rotate(-200deg)}}
.smell{opacity:0;animation:smell 1.4s ease-out 2.5s both}
.smell.b{animation-delay:2.9s}.smell.c{animation-delay:3.3s}
@keyframes smell{0%{opacity:0;transform:none}30%{opacity:1}100%{opacity:0;transform:translate(-30px,-26px)}}
.eo{animation:fadeout .2s 2.9s forwards}
.ec{opacity:0;animation:fadein .2s 2.9s forwards}
</style>
