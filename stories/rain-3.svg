<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.fall{animation:fall .5s linear infinite}
@keyframes fall{from{transform:translate(3px,-28px)}to{transform:translate(0,0)}}
.hx{animation:hx 2.4s linear both}
@keyframes hx{to{transform:translateX(130px)}}
.hy{animation:hy 2.4s both}
@keyframes hy{0%,33.3%,66.6%,100%{transform:translateY(0);animation-timing-function:ease-out}16.6%,50%,83.3%{transform:translateY(-30px);animation-timing-function:ease-in}}
.sq{transform-box:fill-box;transform-origin:50% 100%;animation:sq .3s ease-out 2.4s}
@keyframes sq{50%{transform:scale(1.12,.86)}}
.upl{transform-box:fill-box;transform-origin:50% 0;animation:upl .3s ease-out 2.5s both}
@keyframes upl{to{transform:rotate(145deg)}}
.upr{transform-box:fill-box;transform-origin:50% 0;animation:upr .3s ease-out 2.5s both}
@keyframes upr{to{transform:rotate(-145deg)}}
.splash{transform-origin:166px 148px;animation:burst .5s ease-out 2.4s both,gone .4s 3.1s forwards}
@keyframes burst{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes gone{to{opacity:0}}
.rip{transform-box:fill-box;transform-origin:50% 50%;animation:rip 1.4s ease-out infinite}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1);opacity:0}}
</style>
