<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{transform-origin:30px 28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.wave{animation:wave 2s linear infinite}
@keyframes wave{to{transform:translateX(20px)}}
.bobw{animation:bobw 1.2s ease-in-out infinite alternate}
@keyframes bobw{to{transform:translateY(-3px)}}
.cheer{transform-box:fill-box;transform-origin:10% 50%;animation:flapw .25s ease-in-out .3s 12 alternate}
@keyframes flapw{to{transform:rotate(-50deg)}}
.momsw{animation:momsw 4s ease-in-out both}
@keyframes momsw{to{transform:translateX(10px)}}
.follow{animation:follow 3.6s ease-in-out both}
@keyframes follow{from{transform:translateX(-60px)}to{transform:none}}
.star{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:spark .8s ease-out .4s 4 both}
@keyframes spark{0%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.6)}}
</style>
