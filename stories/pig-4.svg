<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.jump{animation:jump .7s ease-in-out .2s 3 both}
@keyframes jump{0%,100%{transform:none}45%{transform:translateY(-22px)}}
.cheerl{transform-box:fill-box;transform-origin:50% 10%;animation:cl .7s ease-in-out .2s 3 both}
.cheerr{transform-box:fill-box;transform-origin:50% 10%;animation:cr .7s ease-in-out .2s 3 both}
@keyframes cl{45%{transform:rotate(150deg)}}
@keyframes cr{45%{transform:rotate(-150deg)}}
.h{opacity:0;animation:rise 1.6s ease-out .6s both}
.h.b{animation-delay:1.2s}.h.c{animation-delay:1.8s}.h.d{animation-delay:2.4s}
@keyframes rise{0%{opacity:0;transform:none}25%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.rub{animation:rub .3s ease-in-out 2.5s 4 alternate both}
@keyframes rub{to{transform:translateX(-6px)}}
</style>
