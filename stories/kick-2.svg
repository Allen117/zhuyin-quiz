<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.cl{animation:drift 7s ease-in-out infinite alternate}
.cl.b{animation-delay:-3.5s}
@keyframes drift{to{transform:translateX(26px)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes on{from{opacity:0}to{opacity:1}}
@keyframes off{to{opacity:0}}
.rays{transform-origin:28px 26px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.kick{transform-box:fill-box;transform-origin:50% 0;animation:kick .7s ease-in-out both}
@keyframes kick{45%{transform:rotate(-60deg)}100%{transform:rotate(0)}}
.bx{animation:bx 1.6s linear .3s both}
@keyframes bx{to{transform:translateX(70px)}}
.by{transform-box:fill-box;transform-origin:center;animation:by 1.6s cubic-bezier(.2,.75,.4,1) .3s both}
@keyframes by{to{transform:translateY(-112px) scale(.8)}}
.hv{animation:hv .4s ease-in-out 2s 4 alternate}
@keyframes hv{to{transform:translateY(-4px)}}
.trail{opacity:0;animation:on .5s 1.9s forwards}
.pt{transform-origin:-13px -44px;animation:pt .5s ease-out 2s both}
@keyframes pt{to{transform:rotate(160deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
