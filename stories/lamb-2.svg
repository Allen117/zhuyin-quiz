<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.fall{animation:fall .5s linear infinite}
@keyframes fall{from{transform:translate(0,-20px)}to{transform:translate(-6px,20px)}}
.dark{opacity:0;animation:fade 1.2s ease-out both}
@keyframes fade{to{opacity:1}}
.clouds{animation:cin 1.4s ease-out both}
@keyframes cin{from{transform:translateY(-70px)}to{transform:none}}
.rain{opacity:0;animation:fade .6s 1.2s forwards}
.puddle{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:grow 1.2s ease-out 2s both}
@keyframes grow{from{opacity:1;transform:scale(0)}to{opacity:1;transform:none}}
.shiver{animation:shiver .08s linear 2.2s 22 alternate}
@keyframes shiver{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
.q{opacity:0;animation:fade .4s 2.2s forwards}
</style>
