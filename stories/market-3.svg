<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes on{from{opacity:0}to{opacity:1}}
@keyframes off{to{opacity:0}}
.up{opacity:0;animation:up 1.2s ease-out both}
@keyframes up{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:1;transform:translateY(-8px)}}
.steam{animation:steam 1.6s ease-in-out infinite}
.steam.b{animation-delay:-.8s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

.fire{transform-box:fill-box;transform-origin:50% 100%;animation:fire .25s ease-in-out infinite alternate}
@keyframes fire{to{transform:scaleY(.7)}}
.toss{animation:toss .4s ease-in-out 8 alternate}
@keyframes toss{to{transform:translateY(-4px)}}
.tarm{animation:tarm .4s ease-in-out 8 alternate}
@keyframes tarm{to{transform:translateY(-3.3px)}}
.hopf{animation:hopf .4s ease-in-out 8 alternate}
@keyframes hopf{to{transform:translateY(-12px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
