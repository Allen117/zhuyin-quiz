<g fill="#fff"><circle cx="-14" cy="-18" r="10"/><circle cx="-4" cy="-24" r="11"/><circle cx="8" cy="-20" r="10"/><circle cx="-8" cy="-12" r="10"/><circle cx="4" cy="-12" r="10"/><circle cx="-20" cy="-12" r="7"/></g>
