<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.sky{opacity:0;animation:fade 1.6s ease-out both}
@keyframes fade{to{opacity:1}}
.rise{transform:translateY(80px);animation:rise 1.6s ease-out both}
@keyframes rise{from{transform:translate(0,100px)}to{transform:translate(0,40px)}}
.rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.walk{animation:walk 2.6s ease-in-out 1.4s both}
@keyframes walk{from{transform:translateX(-40px)}to{transform:translateX(110px)}}
.bob{animation:bob .3s ease-in-out 1.4s 9 alternate}
@keyframes bob{to{transform:translateY(-4px)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<rect width="240" height="168" fill="#ffe0b2" stroke="none"/>
<rect class="sky" width="240" height="168" fill="#d6efff" stroke="none"/>
