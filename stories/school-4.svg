<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.wave{transform-box:fill-box;transform-origin:0 0;animation:wave 2s ease-in-out both}
@keyframes wave{0%,100%{transform:rotate(0)}15%,45%,85%{transform:rotate(-125deg)}30%,65%{transform:rotate(-155deg)}}
.say{opacity:0;animation:say 1.6s ease-out .3s both}
.say.b{animation-delay:.6s}
@keyframes say{0%{opacity:0;transform:none}25%,70%{opacity:1}100%{opacity:0;transform:translateX(14px)}}
.bow{transform-box:fill-box;transform-origin:50% 100%;animation:bow 1.4s ease-in-out 2.1s both}
@keyframes bow{0%,100%{transform:none}35%,65%{transform:rotate(14deg) translateY(2px)}}
.nod{animation:nod .8s ease-in-out 3.5s both}
@keyframes nod{0%,100%{transform:none}25%,75%{transform:translateY(4px)}50%{transform:none}}
.heart{opacity:0;animation:rise 1.4s ease-out 3.4s both}
@keyframes rise{0%{opacity:0;transform:none}30%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
</style>
