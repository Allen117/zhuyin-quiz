<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
.popc{transform-box:fill-box;transform-origin:50% 50%;animation:pop .45s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.wob{transform-box:fill-box;transform-origin:50% 100%;animation:wob .15s ease-in-out .1s 4 alternate}
@keyframes wob{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.fall{transform-box:fill-box;transform-origin:50% 100%;animation:fall 1.6s ease-in .7s both}
@keyframes fall{0%{transform:none}35%{transform:translate(22px,0) rotate(0)}55%{transform:translate(24px,10px) rotate(45deg)}100%{transform:translate(21px,53px) rotate(100deg)}}
.push{animation:push .3s ease-in-out .5s 2 alternate}
@keyframes push{to{transform:translate(5px,1px)}}
.startle{animation:startle .5s ease-out 2.3s}
@keyframes startle{40%{transform:translateY(-14px)}}
.eo{animation:hide .1s 2.3s forwards}
.ew{opacity:0;animation:show .1s 2.3s forwards}
@keyframes hide{to{opacity:0}}
@keyframes show{to{opacity:1}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
