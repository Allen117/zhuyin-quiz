<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.walk{animation:walk .7s ease-out both}
@keyframes walk{from{transform:translate(-18px,0)}to{transform:none}}
.sniff{animation:sniff .35s ease-in-out .7s 8 alternate}
@keyframes sniff{to{transform:translate(4px,2px)}}
.sm{opacity:0;animation:sm .7s ease-in-out .8s 4}
.sm.b{animation-delay:1.1s}
@keyframes sm{50%{opacity:1}}
.wob{transform-box:fill-box;transform-origin:50% 100%;animation:wob .2s ease-in-out 3.4s 4 alternate}
@keyframes wob{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.tail{transform-box:fill-box;transform-origin:50% 50%;animation:tail 1.6s ease-in-out infinite alternate}
@keyframes tail{to{transform:rotate(10deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
