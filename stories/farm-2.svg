<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
.popc{transform-box:fill-box;transform-origin:50% 50%;animation:pop .45s cubic-bezier(.3,1.6,.6,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.drift{animation:drift 7s ease-in-out infinite alternate}
.drift.b{animation-delay:-3.5s}
@keyframes drift{to{transform:translateX(14px)}}
.moo{transform-box:fill-box;transform-origin:50% 0;animation:moo .4s ease-in-out 2.5s 3 alternate}
@keyframes moo{to{transform:rotate(-10deg) translateY(2px)}}
.snd{opacity:0;animation:snd .5s ease-out 2.6s 3}
@keyframes snd{0%{opacity:0;transform:translateX(0)}50%{opacity:1}100%{opacity:0;transform:translateX(-6px)}}
.nib{transform-box:fill-box;transform-origin:50% 50%;animation:nib 1.2s ease-in-out infinite alternate}
@keyframes nib{to{transform:rotate(8deg)}}
</style>
