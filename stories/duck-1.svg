<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{transform-origin:30px 28px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.walk{animation:walk 2.2s ease-out both}
@keyframes walk{from{transform:translateX(-80px)}to{transform:translateX(50px)}}
.waddle{transform-box:fill-box;transform-origin:50% 100%;animation:waddle .3s ease-in-out 8 alternate}
@keyframes waddle{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.wing{transform-box:fill-box;transform-origin:10% 50%;animation:flapw .25s ease-in-out 2.4s 8 alternate}
@keyframes flapw{to{transform:rotate(-40deg)}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
