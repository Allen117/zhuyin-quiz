<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.walk{animation:walk 2.6s ease-out both}
@keyframes walk{from{transform:translateX(-24px)}to{transform:translateX(96px)}}
.bob{animation:bob .3s ease-in-out 8 alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.spark{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:pop .5s ease-out 2.8s both}
.wave{transform-box:fill-box;transform-origin:0 0;animation:wave 1.6s ease-in-out 3.2s both}
@keyframes wave{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-125deg)}50%{transform:rotate(-150deg)}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flag 1s ease-in-out infinite alternate}
@keyframes flag{to{transform:skewY(8deg) scaleX(.9)}}
</style>
