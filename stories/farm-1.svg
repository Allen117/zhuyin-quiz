<g transform="translate(150 18) scale(0.8)"><g class="drift b"><path d="M-20 8a8 8 0 0 1 2 -14a11 11 0 0 1 20 -4a9 9 0 0 1 16 8a7 7 0 0 1 2 10z" fill="#fff"/></g></g>
