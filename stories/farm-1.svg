<circle class="smoke" cx="182" cy="38" r="5" fill="#fff" stroke="none"/><circle class="smoke b" cx="182" cy="38" r="5" fill="#fff" stroke="none"/><circle class="smoke c" cx="182" cy="38" r="5" fill="#fff" stroke="none"/>
<rect x="176" y="40" width="12" height="26" fill="#b0705a"/><rect x="110" y="82" width="90" height="60" fill="#fffaf0"/><path d="M100 86L155 50L210 86Z" fill="#d9534f"/><path d="M128 68L182 68M115 78H195" stroke="#b03a36" stroke-width="1.5"/><rect x="144" y="106" width="22" height="36" rx="2" fill="#a0714f"/><rect x="118" y="96" width="18" height="16" fill="#bfe3ff"/><path d="M127 96v16M118 104h18"/><rect x="174" y="96" width="18" height="16" fill="#bfe3ff"/><path d="M183 96v16M174 104h18"/>
