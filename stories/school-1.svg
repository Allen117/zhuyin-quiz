<rect x="64" y="94" width="12" height="12" fill="#cdeeff"/>
<g class="sway b"><rect x="144" y="96" width="12" height="46" rx="3" fill="#8a5a3c"/><circle cx="138" cy="88" r="17" fill="#5fb04a"/><circle cx="162" cy="86" r="17" fill="#5fb04a"/><circle cx="150" cy="70" r="19" fill="#6cc055"/></g>
<g class="walk"><g transform="translate(49 146)"><g class="bob">
<path d="M-6 -18v18M6 -18v18" stroke-width="5"/>
<rect x="-21" y="-48" width="13" height="24" rx="4" fill="#e74c3c"/>
<rect x="-13" y="-50" width="26" height="34" rx="9" fill="#5dade2"/>
<g class=""><path d="M-11 -44l-8 16" stroke-width="4"/><circle cx="-19" cy="-27" r="3.5" fill="#ffd9b8"/></g>
<g class="wave"><path d="M11 -44l8 16" stroke-width="4"/><circle cx="19" cy="-27" r="3.5" fill="#ffd9b8"/></g>
<circle cy="-64" r="14" fill="#ffd9b8"/>
