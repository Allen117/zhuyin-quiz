<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168">
<style>
.rays{animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.sway.b{animation-delay:-1.5s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.drift{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
@keyframes fadein{to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}

.sunup{animation:sunup 2s ease-out both}
@keyframes sunup{from{transform:translateY(62px)}to{transform:none}}
.night{opacity:.7;animation:fadeout 1.8s ease-in forwards}
.walk{animation:walk 2.4s ease-in-out 1.8s both}
@keyframes walk{to{transform:translateX(128px)}}
.bob{animation:bob .3s ease-in-out 1.8s 8 alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.wave{transform-box:fill-box;transform-origin:0 0;animation:wave 1.2s ease-in-out 4.2s both}
@keyframes wave{0%,100%{transform:rotate(0)}25%,75%{transform:rotate(-125deg)}50%{transform:rotate(-150deg)}}
.tw{animation:tw 1s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.3}}
</style>
<g stroke="#3a3a3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
