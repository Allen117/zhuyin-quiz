<circle cx="-5" cy="-63" r="1.8" fill="#333" stroke="none"/><circle cx="5" cy="-63" r="1.8" fill="#333" stroke="none"/>
<circle cx="-8" cy="-58" r="2.5" fill="#ff9e9e" stroke="none" opacity=".7"/><circle cx="8" cy="-58" r="2.5" fill="#ff9e9e" stroke="none" opacity=".7"/>
<path d="M-4 -58q4 6 8 0z" fill="#c0392b" stroke-width="1.5"/>
</g></g></g>
<rect class="night" width="240" height="168" fill="#1f2a5c" stroke="none"/>
<g class="night" fill="#fff6b0" stroke="none"><circle class="tw" cx="30" cy="20" r="2"/><circle cx="80" cy="14" r="1.6"/><circle class="tw" cx="130" cy="24" r="2"/><circle cx="170" cy="12" r="1.6"/></g>
</g></svg>
