<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注音符號測驗</title>
<style>
  @page { size: A4; margin: 12mm; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #eee; color: #000;
    font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", serif;
    font-size: 26px;
  }
  .page { width: 210mm; min-height: 297mm; margin: 16px auto; padding: 12mm; background: #fff; }

  .toolbar { position: sticky; top: 0; z-index: 10; display: flex; justify-content: center; gap: 12px; padding: 10px; background: #333; font-family: system-ui, sans-serif; }
  .toolbar button { font-size: 20px; padding: 8px 28px; cursor: pointer; border: 0; border-radius: 6px; background: #fff; }
  .toolbar .tabs { display: flex; gap: 6px; margin-right: 24px; }
  .toolbar .tabs button { background: #666; color: #fff; }
  .toolbar .tabs button.on { background: #ffb74d; color: #000; font-weight: bold; }

  /* 注音：符號直排，聲調在右，輕聲點在上 */
  .zy { display: inline-flex; align-items: flex-end; vertical-align: middle; line-height: 1; }
  .zy-col { display: inline-flex; flex-direction: column; align-items: center; }
  .zy-s { display: block; height: 1em; }
  .zy-light { display: block; font-size: .6em; height: .7em; line-height: .7em; }
  .zy-tone { display: inline-block; width: .8em; font-size: .6em; margin-bottom: 1.1em; }
  /* 聲調用線條畫，不靠字型：iPad 沒有標楷體，系統字型的 ˊˇˋ 小得像一個點 */
  .tn { display: block; width: .8em; height: 1em; }
  .zy-light .tn { width: 1em; height: .7em; }
  .pad-keys .tn { display: inline-block; width: .8em; height: 1em; vertical-align: middle; }
  .zy-blank { width: 1.15em; height: 1.15em; border: 2px solid #000; margin: 1px 0; display: flex; align-items: center; justify-content: center; }

  /* 國字＋小注音 */
  .hz { display: inline-flex; align-items: center; margin: 0 .05em; }
  .hz .zy { font-size: .5em; margin-left: .1em; }

  h1 { text-align: center; font-size: 34px; font-weight: normal; margin: 0 0 10px; }
  .info { display: flex; justify-content: space-between; font-size: 22px; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 8px; }
  .info > span { white-space: nowrap; display: inline-flex; align-items: center; }
  .info .line { display: inline-block; width: 3em; height: 1.2em; border-bottom: 1px solid #000; text-align: center; color: #c62828; }

  h2 { font-size: 26px; font-weight: normal; margin: 18px 0 8px; }
  h2.sub { font-size: 24px; margin: 10px 0 6px 1em; }
  .items { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
  .q { display: flex; align-items: center; gap: 10px; break-inside: avoid; min-height: 90px; }
  .q.wide { grid-column: 1 / -1; }
  .big-zy { font-size: 34px; min-width: 64px; text-align: center; }
  .q-no { font-size: 20px; display: inline-grid; place-items: center; min-width: 2em; height: 2em; border: 2px solid transparent; border-radius: 50%; flex: none; }
  .emoji { font-size: 56px; line-height: 1; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  .paren { white-space: nowrap; }
  .slot { display: inline-grid; width: 1.2em; justify-items: center; }
  .slot > * { grid-area: 1 / 1; }
  .opts { display: flex; gap: 36px; align-items: center; margin-left: 12px; }
  .opt { display: inline-flex; align-items: center; gap: 2px; padding: 4px 8px; border: 3px solid transparent; border-radius: 12px; }
  .opt-n { font-size: 20px; }
  .op { font-size: 24px; }
  .syls { display: inline-flex; align-items: center; gap: 10px; }
  .sentence { display: inline-flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: 12px; }
  /* 填空框：正確答案與學生作答疊在同一格 */
  .syl-box { width: 1.8em; height: 3.6em; border: 2px solid #000; display: inline-grid; place-items: center; }
  .tone-box { font-size: .85em; width: 1.3em; height: 1.3em; border: 2px solid #000; display: inline-grid; place-items: center; margin-left: 4px; margin-bottom: .5em; }
  .syl-box > *, .tone-box > * { grid-area: 1 / 1; }
  .answer-box { min-width: 2em; min-height: 3.4em; border: 2px solid #000; display: inline-flex; align-items: center; justify-content: center; padding: 4px; }
  /* 連連看：左圖、右注音，線畫在中間 */
  .match { display: grid; grid-template-columns: 70px 24px 220px 24px auto; grid-auto-rows: 80px; align-items: center; margin-left: 12px; }
  .match .dot { font-size: 16px; text-align: center; }
  .match svg { width: 100%; height: 100%; align-self: stretch; }
  .match .ans line { stroke: #d00; stroke-width: 3; vector-effect: non-scaling-stroke; }
  .match .user-lines line { stroke: #1565c0; stroke-width: 3; vector-effect: non-scaling-stroke; }
  .match .sel { background: #bbdefb; border-radius: 8px; }
  /* 圈出相同的符號 */
  .target-sym { font-size: 34px; border: 2px solid #000; padding: 2px 10px; margin: 0 16px 0 4px; }
  .sym-row { display: flex; gap: 14px; font-size: 34px; }
  .sym { border: 2px solid transparent; border-radius: 50%; padding: 2px 10px; }
  /* 聽寫：按喇叭播放 */
  .speak { font-size: 40px; width: 72px; height: 72px; border-radius: 50%; border: 3px solid #1565c0; background: #e3f2fd; cursor: pointer; padding: 0; flex: none; font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
  .speak:active, .speak.playing { background: #90caf9; }
  .q-dictation { flex-wrap: wrap; }

  /* 學生作答（藍色） */
  [data-act] { cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .user { color: #1565c0; }
  .opt.picked { border-color: #1565c0; }
  .sym.circled { border-color: #1565c0; }
  .locked [data-act] { cursor: default; }

  /* 交卷後：錯的題目題號圈紅，正確答案用紅字寫在題目後面 */
  .q.wrong .q-no { border-color: #d00; color: #d00; }
  .fix { display: inline-flex; align-items: center; gap: 10px; color: #d00; margin-left: 16px; white-space: nowrap; }
  .fix .emoji { font-size: 44px; }
  .q.wrong .match .ans { visibility: visible; }
  .q.wrong .sym.hit { box-shadow: 0 0 0 3px #d00; }

  /* 教師版（網址加 ?answers）：紅色正確答案 */
  .ans { visibility: hidden; }
  .teacher { display: none; }
  .show-answers .ans { visibility: visible; color: #d00; }
  .show-answers .user { visibility: hidden; }
  .show-answers .sym.hit { border-color: #d00; }
  .show-answers .teacher { display: inline; white-space: nowrap; color: #888; font-size: 18px; }
  .warn { color: #fff; background: #d00; font-size: 14px; padding: 2px 6px; font-family: system-ui, sans-serif; }

  .submit-wrap { text-align: center; margin: 36px 0 8px; }
  .submit { font-size: 34px; padding: 18px 90px; border: 0; border-radius: 16px; background: #2e7d32; color: #fff; cursor: pointer; font-family: inherit; }
  .locked .submit { background: #9e9e9e; }

  /* 大視窗（注音鍵盤、成績） */
  .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .45); display: flex; align-items: center; justify-content: center; }
  .overlay[hidden] { display: none; }
  .panel { background: #fff; border-radius: 18px; padding: 20px; width: min(780px, 96vw); max-height: 96vh; overflow: auto; }
  .pad-preview { font-size: 76px; height: 3.4em; display: flex; align-items: center; justify-content: center; border: 3px dashed #1565c0; border-radius: 14px; margin-bottom: 14px; color: #1565c0; }
  .pad-keys { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pad-keys button { font: inherit; font-size: 34px; width: 64px; height: 64px; border-radius: 10px; border: 2px solid #999; background: #f5f5f5; cursor: pointer; padding: 0; }
  .pad-keys button:active { background: #bbdefb; }
  .pad-keys.tones button { width: 96px; background: #fff3e0; font-family: system-ui, sans-serif; font-weight: bold; }
  .pad-keys.tones button.on { background: #ffb74d; border-color: #e65100; }
  [hidden] { display: none !important; }
  /* 先選作答方式 */
  .pad-choose { display: flex; gap: 16px; margin-bottom: 14px; font-family: system-ui, sans-serif; }
  .pad-choose button { flex: 1; font-size: 64px; padding: 24px 10px; border-radius: 16px; border: 3px solid #999; background: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pad-choose button span { font-size: 30px; font-weight: bold; }
  .pad-choose button.last { border-color: #1565c0; background: #e3f2fd; }
  /* 手寫樣板：左邊一直排三格寫符號、右邊長格寫聲調；每格右邊是那格的候選字 */
  .hw { --c: 120px; display: flex; gap: 14px; }
  .hw-board { width: calc(var(--c) * 1.6); height: calc(var(--c) * 3); flex: none; border: 3px solid #1565c0; border-radius: 12px; touch-action: none; background: #fff; overflow: hidden; }
  .hw-board canvas { width: 100%; height: 100%; display: block; }
  .hw-rows { flex: 1; display: flex; flex-direction: column; }
  .hw-row { height: var(--c); display: flex; align-items: center; gap: 8px; }
  .hw-row button { font: inherit; font-size: 40px; width: 70px; height: 70px; border-radius: 12px; border: 2px solid #999; background: #f5f5f5; cursor: pointer; padding: 0; }
  .hw-row button.on { border: 3px solid #1565c0; background: #bbdefb; }
  .hw-bottom { display: flex; align-items: center; gap: 10px; margin: 10px 0 12px; font-family: system-ui, sans-serif; }
  .hw-hint { flex: 1; font-size: 18px; color: #666; }
  .hw-bottom button { font-size: 22px; padding: 10px 18px; border-radius: 10px; border: 2px solid #999; background: #fff; cursor: pointer; }
  .pad-actions { display: flex; gap: 12px; justify-content: flex-end; font-family: system-ui, sans-serif; }
  .pad-actions button { font-size: 24px; padding: 12px 28px; border-radius: 10px; border: 2px solid #999; background: #fff; cursor: pointer; }
  .pad-actions .ok { background: #1565c0; border-color: #1565c0; color: #fff; font-weight: bold; padding: 12px 56px; }
  .result { text-align: center; padding: 20px 10px; }
  .result .score { font-size: 120px; color: #c62828; font-family: system-ui, sans-serif; font-weight: bold; margin: 10px 0 20px; }
  .result button { font-size: 28px; padding: 12px 60px; border-radius: 12px; border: 0; background: #1565c0; color: #fff; cursor: pointer; }

  @media (max-width: 840px) { .page { width: auto; margin: 0; } }
  @media (max-height: 900px) { .pad-preview { font-size: 56px; } .hw { --c: 96px; } }
  @media print {
    body { background: #fff; }
    .page { margin: 0; padding: 0; width: auto; min-height: 0; }
    .toolbar, .submit-wrap, .overlay, .tablet-only { display: none; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <div class="tabs" id="tabs"></div>
  <button id="clear">清除作答</button>
  <button onclick="window.print()">列印</button>
</div>
<div id="pages"></div>

<!-- 注音鍵盤 -->
<div class="overlay" id="pad" hidden>
  <div class="panel">
    <div class="pad-preview" id="pad-preview"></div>
    <div class="pad-choose" id="pad-choose">
      <button data-mode="keys">⌨<span>鍵盤</span></button>
      <button data-mode="hw">✍<span>手寫</span></button>
    </div>
    <div id="pad-syms"></div>
    <div id="pad-hw">
      <div class="hw">
        <div class="hw-board"><canvas id="hw-canvas"></canvas></div>
        <div class="hw-rows" id="hw-rows"></div>
      </div>
      <div class="hw-bottom">
        <div class="hw-hint">由上往下，一格寫一個符號；聲調寫在右邊長格。認錯了就點右邊的字換一個。</div>
        <button data-hw="undo">↶ 上一筆</button>
        <button data-hw="clear">🗑 清除</button>
      </div>
    </div>
    <div class="pad-keys tones" id="pad-tones"></div>
    <div class="pad-actions">
      <button data-pad="switch" id="pad-switch">↩ 換方式</button>
      <button data-pad="back" id="pad-back">⌫ 刪除</button>
      <button data-pad="cancel">取消</button>
      <button data-pad="ok" class="ok" id="pad-ok">確定</button>
    </div>
  </div>
</div>

<!-- 成績 -->
<div class="overlay" id="result" hidden>
  <div class="panel result">
    <div id="result-title"></div>
    <div class="score" id="result-score"></div>
    <button id="result-close">好</button>
  </div>
</div>

<!-- 每個檔案是一份試卷，依載入順序排在上方的切換按鈕 -->
<script src="questions1.js"></script>
<script src="questions2.js"></script>
<script src="questions3.js"></script>
<script src="hw-templates.js"></script>
<script src="handwriting.js"></script>
<script>
const TONES = 'ˊˇˋ';
const CIRCLED = '①②③④⑤⑥';

// 聲調符號畫成 SVG（顏色跟著文字顏色走）
const TONE_PATH = {
  'ˊ': '<path d="M2.5 8 L5.5 2"/>',
  'ˇ': '<path d="M1.5 3 L4 7.5 L6.5 3"/>',
  'ˋ': '<path d="M2.5 2 L5.5 8"/>',
  '˙': '<circle cx="4" cy="5" r="1.4" fill="currentColor" stroke="none"/>',
  'ˉ': '<path d="M1.5 5 L6.5 5"/>',
};
const toneSVG = t => TONE_PATH[t]
  ? `<svg class="tn" viewBox="0 0 8 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">${TONE_PATH[t]}</svg>`
  : '';

function parseZy(z) {
  const light = z.includes('˙');
  z = z.replace('˙', '');
  let tone = '';
  if (TONES.includes(z.slice(-1))) { tone = z.slice(-1); z = z.slice(0, -1); }
  return { syms: [...z], tone, light };
}

// 統一寫法：輕聲點在前、其他聲調在後
function norm(z) {
  const p = parseZy(z);
  return (p.light ? '˙' : '') + p.syms.join('') + p.tone;
}

// blank: 要挖空的符號索引；'tone' 表示挖空聲調（答案藏在框內，教師版才出現）
function zy(z, blank = -1) {
  const p = parseZy(z);
  const syms = p.syms.map((s, i) => i === blank
    ? `<span class="zy-s zy-blank"><span class="ans">${s}</span></span>`
    : `<span class="zy-s">${s}</span>`).join('');
  const light = p.light && blank !== 'tone' ? `<span class="zy-light">${toneSVG('˙')}</span>` : '';
  const tone = blank === 'tone'
    ? `<span class="zy-tone tone-box" data-act="fill" data-mode="tone" data-answer="${p.light ? '˙' : p.tone}" data-base="${p.syms.join('')}"><span class="ans">${toneSVG(p.light ? '˙' : p.tone)}</span><span class="user"></span></span>`
    : `<span class="zy-tone">${toneSVG(p.tone)}</span>`;
  return `<span class="zy"><span class="zy-col">${light}${syms}</span>${tone}</span>`;
}

// 「看(ㄎㄢˋ)圖(ㄊㄨˊ)」→ 國字右側加注音
function ruby(str) {
  return str.replace(/([^()\s])\(([^)]+)\)/g, (_, c, z) => `<span class="hz">${c}${zy(z)}</span>`);
}

// 括號：ans 是正確答案（教師版才出現），user 是學生點選的結果
const paren = (ans, act = '') =>
  `<span class="paren"${act ? ` data-act="${act}"` : ''}>（<span class="slot"><span class="ans">${ans}</span><span class="user"></span></span>）</span>`;

// 整個字的填空框，點了會開注音鍵盤
const sylBox = z =>
  `<span class="syl-box" data-act="fill" data-mode="syl" data-answer="${norm(z)}"><span class="ans">${zy(z)}</span><span class="user"></span></span>`;

const teacher = it => `<span class="teacher">（${it.word}）</span>`;

// 把短句拆成注音；[ ] 內的字交給 blankFn 處理
function sentenceHTML(it, blankFn) {
  const parts = [];
  let inBlank = false, word = '';
  for (const m of it.text.matchAll(/\[|\]|([^()\[\]])\(([^)]+)\)|([^()\[\]])/g)) {
    if (m[0] === '[') { inBlank = true; continue; }
    if (m[0] === ']') { inBlank = false; continue; }
    if (m[3]) { parts.push(`<span class="punct">${m[3]}</span>`); continue; }
    if (inBlank) { word += m[1]; parts.push(blankFn(m[2])); }
    else parts.push(zy(m[2]));
  }
  return `<span class="emoji">${it.emoji}</span><span class="sentence">${parts.join('')}</span>${teacher({ word })}`;
}

const render = {
  choice(it) {
    const idx = it.options.indexOf(it.answer);
    const warn = idx < 0 ? '<span class="warn">answer 不在 options 裡</span>' : '';
    const opts = it.options.map((o, i) =>
      `<span class="opt" data-act="opt" data-n="${CIRCLED[i]}"><span class="opt-n">${CIRCLED[i]}</span>${zy(o)}</span>`).join('');
    return `${paren(CIRCLED[idx] ?? '')}
      <span class="emoji">${it.emoji}</span><div class="opts">${opts}</div>${teacher(it)}${warn}`;
  },
  blank(it) {
    return `<span class="emoji">${it.emoji}</span>${zy(it.zhuyin, it.blank)}${teacher(it)}`;
  },
  pickPic(it) {
    const idx = it.options.indexOf(it.answer);
    const warn = idx < 0 ? '<span class="warn">answer 不在 options 裡</span>' : '';
    const opts = it.options.map((o, i) =>
      `<span class="opt" data-act="opt" data-n="${CIRCLED[i]}"><span class="opt-n">${CIRCLED[i]}</span><span class="emoji">${o}</span></span>`).join('');
    return `${paren(CIRCLED[idx] ?? '')}
      <span class="big-zy">${zy(it.zhuyin)}</span><div class="opts">${opts}</div>${teacher(it)}${warn}`;
  },
  // 詞語：zhuyin 是每個字的注音陣列，blank 是要整個挖空的字（索引）
  wordBlank(it) {
    const syls = it.zhuyin.map((z, i) => i === it.blank ? sylBox(z) : zy(z)).join('');
    return `<span class="emoji">${it.emoji}</span><span class="syls">${syls}</span>${teacher(it)}`;
  },
  // 短句：text 用「字(注音)」，[ ] 包住要挖空的詞；學生卷只顯示注音
  sentence(it) {
    return sentenceHTML(it, sylBox);
  },
  // 短句補聲調：[ ] 包住的字只挖空聲調
  toneSentence(it) {
    return sentenceHTML(it, z => zy(z, 'tone'));
  },
  match(it) {
    const n = it.pairs.length;
    const cells = [];
    const lines = [];
    it.pairs.forEach(([emoji], i) => {
      cells.push(`<span class="emoji" data-act="ml" data-i="${i}" style="grid-area:${i + 1}/1">${emoji}</span><span class="dot" data-act="ml" data-i="${i}" style="grid-area:${i + 1}/2">●</span>`);
    });
    it.right.forEach((p, row) => {
      cells.push(`<span class="dot" data-act="mr" data-i="${row}" style="grid-area:${row + 1}/4">●</span><span data-act="mr" data-i="${row}" style="grid-area:${row + 1}/5">${zy(it.pairs[p][1])}</span>`);
      lines.push(`<line x1="0" y1="${p * 100 + 50}" x2="100" y2="${row * 100 + 50}"/>`);
    });
    const svg = cls => `<svg class="${cls}" style="grid-area:1/3/${n + 1}/4" viewBox="0 0 100 ${n * 100}" preserveAspectRatio="none">${cls === 'ans' ? lines.join('') : ''}</svg>`;
    return `<div class="match">${cells.join('')}${svg('ans')}${svg('user-lines')}</div>${teacher({ word: it.pairs.map(p => p[2]).join('、') })}`;
  },
  findSym(it) {
    const row = it.row.map(s => `<span class="sym${s === it.target ? ' hit' : ''}" data-act="sym">${s}</span>`).join('');
    return `<span class="target-sym">${it.target}</span><span class="sym-row">${row}</span>`;
  },
  judge(it) {
    const syls = it.zhuyin.map(z => zy(z)).join('');
    const word = it.word + (it.correct ? '' : `，應為 ${it.fix ?? '?'}`);
    return `${paren(it.correct ? '○' : '×', 'judge')}
      <span class="emoji">${it.emoji}</span><span class="syls">${syls}</span>${teacher({ word })}`;
  },
  combine(it) {
    const parts = it.parts.map(p => zy(p)).join('<span class="op">＋</span>');
    return `<span class="emoji">${it.emoji}</span>${parts}<span class="op">＝</span>
      <span class="answer-box"><span class="ans">${zy(it.answer)}</span></span>${teacher(it)}`;
  },
  // 聽寫：按喇叭念 word，每個字一個填空框
  dictation(it) {
    return `<button class="speak" data-say="${it.word}">🔊</button>
      <span class="syls">${it.zhuyin.map(sylBox).join('')}</span>${teacher(it)}`;
  },
};

// 改分數：每種題型「有沒有作答」與「對不對」
const fillsOf = q => [...q.querySelectorAll('[data-act="fill"]')];
const grade = {
  choice: {
    answered: q => !!q.querySelector('.opt.picked'),
    correct: (q, it) => q.querySelector('.opt.picked')?.dataset.n === CIRCLED[it.options.indexOf(it.answer)],
  },
  findSym: {
    answered: q => !!q.querySelector('.sym.circled'),
    correct: q => [...q.querySelectorAll('.sym')].every(s => s.classList.contains('hit') === s.classList.contains('circled')),
  },
  judge: {
    answered: q => q.querySelector('.user').textContent !== '',
    correct: (q, it) => q.querySelector('.user').textContent === (it.correct ? '○' : '×'),
  },
  match: {
    answered: (q, it) => (q.querySelector('.match')._links?.size ?? 0) === it.pairs.length,
    correct: (q, it) => it.pairs.every((_, i) => q.querySelector('.match')._links?.get(i) === it.right.indexOf(i)),
  },
  fill: {
    answered: q => fillsOf(q).every(b => b.dataset.val),
    correct: q => fillsOf(q).every(b => (b.dataset.val ?? '') === b.dataset.answer),
  },
};
grade.pickPic = grade.choice;
grade.wordBlank = grade.sentence = grade.toneSentence = grade.dictation = grade.fill;

// 交卷後寫在錯題後面的正確答案；連連看、圈符號直接在原處用紅色標出，不另外寫
const fixAnswer = {
  choice: it => `${CIRCLED[it.options.indexOf(it.answer)]}${zy(it.answer)}`,
  pickPic: it => `${CIRCLED[it.options.indexOf(it.answer)]}<span class="emoji">${it.answer}</span>`,
  judge: it => it.correct ? '○' : `×${it.fix ? zy(it.fix) : ''}`,
  fill: (it, q) => fillsOf(q).map(b => {
    const a = b.dataset.answer;
    if (b.dataset.mode !== 'tone') return zy(a);
    return zy(a === '˙' ? '˙' + b.dataset.base : b.dataset.base + a);
  }).join(''),
};
fixAnswer.wordBlank = fixAnswer.sentence = fixAnswer.toneSentence = fixAnswer.dictation = fixAnswer.fill;

// 每份試卷一個 .page，各自記住題目（page._questions）、作答與交卷狀態（.locked）
function build(E) {
  const page = document.createElement('div');
  page.className = 'page';
  page.hidden = true;
  const QUESTIONS = page._questions = [];   // { it, el }
  let n = 0;
  const sections = E.sections.map(sec => {
    // 整個大題都是聽寫：紙本沒有聲音，列印時不印
    const tablet = sec.items.length && sec.items.every(it => it.type === 'dictation') ? ' tablet-only' : '';
    return `
    <h2 class="${sec.sub ? 'sub' : ''}${tablet}">${ruby(sec.title)}</h2>
    ${sec.items.length ? `<div class="items${tablet}">${sec.items.map(it => {
      QUESTIONS.push({ it });
      const body = render[it.type] ? render[it.type](it) : `<span class="warn">未知題型 ${it.type}</span>`;
      const wide = ['choice', 'pickPic', 'sentence', 'toneSentence', 'match', 'findSym', 'judge'].includes(it.type);
      return `<div class="q q-${it.type}${wide ? ' wide' : ''}" data-q="${n++}"><span class="q-no">${n}.</span>${body}</div>`;
    }).join('')}</div>` : ''}`;
  }).join('');

  page.innerHTML = `
    <h1>${ruby(E.title)}</h1>
    <div class="info">
      <span>${ruby('年(ㄋㄧㄢˊ)班(ㄅㄢ)')}：<span class="line"></span></span>
      <span>${ruby('座(ㄗㄨㄛˋ)號(ㄏㄠˋ)')}：<span class="line"></span></span>
      <span>${ruby('姓(ㄒㄧㄥˋ)名(ㄇㄧㄥˊ)')}：<span class="line"></span></span>
      <span>${ruby('分(ㄈㄣ)數(ㄕㄨˋ)')}：<span class="line score-line"></span></span>
    </div>
    ${sections}
    <div class="submit-wrap"><button class="submit">${ruby('交(ㄐㄧㄠ)卷(ㄐㄩㄢˋ)')}</button></div>`;
  page.querySelectorAll('.q').forEach(el => { QUESTIONS[el.dataset.q].el = el; });
  document.getElementById('pages').append(page);
  return page;
}

const PAGES = window.EXAMS.map(build);
const curPage = () => PAGES.find(p => !p.hidden);

// ---- 切換試卷（網址 ?exam=2 可直接開第 2 份；切換時作答會保留） ----
const tabs = document.getElementById('tabs');
tabs.innerHTML = window.EXAMS.map((E, k) => `<button data-k="${k}">${E.name}</button>`).join('');
function showExam(k) {
  PAGES.forEach((p, i) => { p.hidden = i !== k; });
  tabs.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === k));
  document.title = `注音符號測驗 - ${window.EXAMS[k].name}`;
  const url = new URL(location);
  url.searchParams.set('exam', k + 1);
  history.replaceState(null, '', url);
  scrollTo(0, 0);
}
tabs.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) showExam(Number(b.dataset.k));
});

const params = new URLSearchParams(location.search);
const startExam = Number(params.get('exam')) - 1;
showExam(startExam >= 0 && startExam < PAGES.length ? startExam : 0);
if (params.has('answers')) document.body.classList.add('show-answers');

// ---- 連連看：每個 .match 記住 links（左 → 右）與目前選到的那一端 ----
function drawLinks(m) {
  m.querySelector('.user-lines').innerHTML = [...(m._links ?? [])].map(([l, r]) =>
    `<line x1="0" y1="${l * 100 + 50}" x2="100" y2="${r * 100 + 50}"/>`).join('');
}
function pickMatch(m, side, i) {
  m._links ??= new Map();
  const prev = m._pending;
  if (!prev || prev.side === side) {
    m._pending = { side, i };
  } else {
    const l = side === 'ml' ? i : prev.i;
    const r = side === 'mr' ? i : prev.i;
    for (const [k, v] of m._links) if (v === r) m._links.delete(k);
    m._links.set(l, r);
    m._pending = null;
    drawLinks(m);
  }
  m.querySelectorAll('.sel').forEach(el => el.classList.remove('sel'));
  if (m._pending) m.querySelectorAll(`[data-act="${side}"][data-i="${i}"]`).forEach(el => el.classList.add('sel'));
}

// ---- 注音鍵盤 ----
const SYM_GROUPS = ['ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ', 'ㄧㄨㄩ', 'ㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ'];
const pad = document.getElementById('pad');
let padBox = null;                       // 目前在填的框
let padCur = { syms: [], tone: '' };     // tone: '' 一聲、'ˊ' 'ˇ' 'ˋ'、'˙' 輕聲
let padStep = 'choose';                  // 'choose' 先選方式、'keys' 鍵盤、'hw' 手寫
let padLast = 'keys';                    // 上次用哪一種（選單上會標出來）

document.getElementById('pad-syms').innerHTML = SYM_GROUPS.map(g =>
  `<div class="pad-keys">${[...g].map(s => `<button data-sym="${s}">${s}</button>`).join('')}</div>`).join('');

const padValue = () => (padCur.tone === '˙' ? '˙' : '') + padCur.syms.join('') + (TONES.includes(padCur.tone) ? padCur.tone : '');

function padRender() {
  const tone = padBox.dataset.mode === 'tone';
  const step = tone ? 'tone' : padStep;  // 補聲調的框只有聲調按鈕，不用選方式
  const show = (id, on) => { document.getElementById(id).hidden = !on; };
  show('pad-choose', step === 'choose');
  show('pad-syms', step === 'keys');
  show('pad-hw', step === 'hw');
  show('pad-tones', step === 'keys' || step === 'tone');
  show('pad-switch', step === 'keys' || step === 'hw');
  show('pad-back', step === 'keys' || step === 'tone');
  show('pad-ok', step !== 'choose');
  document.querySelectorAll('#pad-choose button').forEach(b => b.classList.toggle('last', b.dataset.mode === padLast));
  const tones = tone ? ['ˊ', 'ˇ', 'ˋ', '˙'] : ['', 'ˊ', 'ˇ', 'ˋ', '˙'];
  document.getElementById('pad-tones').innerHTML = tones.map(t =>
    `<button data-tone="${t}" class="${t === padCur.tone ? 'on' : ''}">${toneSVG(t || 'ˉ')}</button>`).join('');
  const preview = tone
    ? zy((padCur.tone === '˙' ? '˙' : '') + padBox.dataset.base + (TONES.includes(padCur.tone) ? padCur.tone : ''))
    : zy(padValue());
  document.getElementById('pad-preview').innerHTML = preview;
  document.getElementById('hw-rows').innerHTML = hwCands.map((cs, i) => `<div class="hw-row">${cs.map((c, j) =>
    `<button data-cell="${i}" data-pick="${j}" class="${j === hwPick[i] ? 'on' : ''}">${c.sym}</button>`).join('')}</div>`).join('');
}

function padOpen(box) {
  padBox = box;
  const p = parseZy(box.dataset.val ?? '');
  padCur = box.dataset.mode === 'tone'
    ? { syms: [], tone: box.dataset.val ?? '' }
    : { syms: p.syms, tone: p.light ? '˙' : p.tone };
  padStep = 'choose';
  pad.hidden = false;
  hwClear();
  padRender();
}

function padCommit() {
  const val = padBox.dataset.mode === 'tone' ? padCur.tone : (padCur.syms.length ? padValue() : '');
  if (val) padBox.dataset.val = val; else delete padBox.dataset.val;
  padBox.querySelector('.user').innerHTML = padBox.dataset.mode === 'tone' ? toneSVG(val) : (val ? zy(val) : '');
  pad.hidden = true;
}

pad.addEventListener('click', e => {
  if (e.target === pad) { pad.hidden = true; return; }     // 點視窗外面＝取消
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.mode) {
    padStep = padLast = b.dataset.mode;
    padRender();
    if (padStep === 'hw') { hwFit(); HW.warmUp(); }
    return;
  }
  if (b.dataset.hw === 'clear') { hwClear(); padCur = { syms: [], tone: '' }; }
  if (b.dataset.hw === 'undo') {
    const st = hwStrokes.pop();
    if (st) { hwDirty.add(st.cell); hwRedraw(); hwRecognize(); }
    return;
  }
  if (b.dataset.pick) { hwPick[b.dataset.cell] = Number(b.dataset.pick); hwApply(); return; }
  if (b.dataset.sym && padCur.syms.length < 3) padCur.syms.push(b.dataset.sym);
  if (b.dataset.tone !== undefined) padCur.tone = b.dataset.tone;
  if (b.dataset.pad === 'back') {
    if (padBox.dataset.mode === 'tone' || !padCur.syms.length) padCur.tone = '';
    else padCur.syms.pop();
  }
  if (b.dataset.pad === 'switch') { padStep = 'choose'; hwClear(); }
  if (b.dataset.pad === 'cancel') { pad.hidden = true; return; }
  if (b.dataset.pad === 'ok') { padCommit(); return; }
  padRender();
});

// ---- 手寫板 ----
// 樣板：左邊一直排三格（每格一個符號，由上往下），右邊一長格寫聲調。
// 每一筆看它的中心落在哪一格就算哪一格的；各格分開辨識，再拼成整個字。
const HW_TONE = 3;                       // 聲調格的編號（0～2 是符號格）
const hwCanvas = document.getElementById('hw-canvas');
const hwCtx = hwCanvas.getContext('2d');
let hwStrokes = [];                      // [{ pts: [{x, y}...], cell }]
let hwCands = [[], [], []];              // 每個符號格的候選字
let hwPick = [0, 0, 0];                  // 每格選了第幾個候選
const hwDirty = new Set();               // 筆畫有變、要重新辨識的格子
let hwTimer = null;
let hwW = 0, hwH = 0;

const hwCell = () => hwH / 3;            // 符號格邊長

// 依實際大小設定畫布解析度（平板高解析度螢幕才不會糊）
function hwFit() {
  const r = hwCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  hwW = r.width; hwH = r.height;
  hwCanvas.width = r.width * dpr;
  hwCanvas.height = r.height * dpr;
  hwCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hwRedraw();
}
function hwRedraw() {
  const c = hwCell(), ctx = hwCtx;
  ctx.clearRect(0, 0, hwW, hwH);
  // 格線：實線分格，虛線是每格的十字中線
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#90caf9';
  ctx.beginPath();
  ctx.moveTo(c, 0); ctx.lineTo(c, hwH);
  ctx.moveTo(0, c); ctx.lineTo(c, c);
  ctx.moveTo(0, 2 * c); ctx.lineTo(c, 2 * c);
  ctx.stroke();
  ctx.strokeStyle = '#e3f2fd';
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    ctx.moveTo(c / 2, i * c + 4); ctx.lineTo(c / 2, (i + 1) * c - 4);
    ctx.moveTo(4, (i + .5) * c); ctx.lineTo(c - 4, (i + .5) * c);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#bbb';
  ctx.font = '16px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('聲調', c + (hwW - c) / 2, 22);
  // 筆跡
  ctx.lineWidth = Math.max(6, c / 16);
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.strokeStyle = '#000';
  for (const { pts } of hwStrokes) {
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    if (pts.length === 1) ctx.lineTo(pts[0].x + .1, pts[0].y);
    ctx.stroke();
  }
}
// 只清手寫板，不動目前的答案（開視窗、換方式時用）
function hwClear() {
  hwStrokes = [];
  hwCands = [[], [], []];
  hwPick = [0, 0, 0];
  hwDirty.clear();
  clearTimeout(hwTimer);
  hwRedraw();
}
// 這一筆屬於哪一格
function hwCellOf(pts) {
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  if (cx > hwCell()) return HW_TONE;
  return Math.min(2, Math.max(0, Math.floor(cy / hwCell())));
}
function hwRecognize() {
  clearTimeout(hwTimer);
  for (const i of hwDirty) {
    if (i === HW_TONE) continue;
    hwCands[i] = HW.recognize(hwStrokes.filter(s => s.cell === i).map(s => s.pts), 4);
    hwPick[i] = 0;
  }
  hwDirty.clear();
  hwApply();
}
// 把各格的辨識結果拼成整個字（空的格子跳過）
function hwApply() {
  padCur.syms = hwCands.flatMap((cs, i) => cs.length ? [cs[hwPick[i]].sym] : []);
  padCur.tone = HW.recognizeTone(hwStrokes.filter(s => s.cell === HW_TONE).map(s => s.pts), hwCell());
  padRender();
}
const hwPoint = e => { const r = hwCanvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
hwCanvas.addEventListener('pointerdown', e => {
  hwCanvas.setPointerCapture(e.pointerId);
  clearTimeout(hwTimer);
  hwStrokes.push({ pts: [hwPoint(e)] });
  hwRedraw();
});
hwCanvas.addEventListener('pointermove', e => {
  if (!hwCanvas.hasPointerCapture(e.pointerId)) return;
  hwStrokes[hwStrokes.length - 1].pts.push(hwPoint(e));
  hwRedraw();
});
function hwEnd() {
  const st = hwStrokes[hwStrokes.length - 1];
  if (!st || st.cell !== undefined) return;
  st.cell = hwCellOf(st.pts);
  hwDirty.add(st.cell);
  clearTimeout(hwTimer);
  hwTimer = setTimeout(hwRecognize, 400);   // 停筆一下才辨識，寫多筆畫不會被打斷
}
hwCanvas.addEventListener('pointerup', hwEnd);
hwCanvas.addEventListener('pointercancel', hwEnd);

// ---- 聽寫的語音：用裝置內建的台灣中文聲音（iPad 是「美佳」） ----
function zhVoice() {
  const vs = speechSynthesis.getVoices().filter(v => /^zh[-_]TW/i.test(v.lang));
  return vs.find(v => /mei-?jia|美佳/i.test(v.name)) ?? vs[0];
}
function say(btn) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(btn.dataset.say);
  const v = zhVoice();
  if (v) u.voice = v;
  u.lang = 'zh-TW';
  u.rate = 0.8;
  btn.classList.add('playing');
  u.onend = u.onerror = () => btn.classList.remove('playing');
  speechSynthesis.speak(u);
}

// ---- 作答 ----
document.getElementById('pages').addEventListener('click', e => {
  const page = e.target.closest('.page');
  if (!page) return;
  if (e.target.closest('.submit')) { submit(page); return; }
  const sp = e.target.closest('.speak');
  if (sp) { say(sp); return; }
  if (page.classList.contains('locked')) return;
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const q = t.closest('.q');
  switch (t.dataset.act) {
    case 'opt':
      q.querySelectorAll('.opt.picked').forEach(o => o.classList.remove('picked'));
      t.classList.add('picked');
      q.querySelector('.user').textContent = t.dataset.n;
      break;
    case 'sym':
      t.classList.toggle('circled');
      break;
    case 'judge': {
      const u = t.querySelector('.user');
      u.textContent = { '': '○', '○': '×', '×': '' }[u.textContent];
      break;
    }
    case 'ml':
    case 'mr':
      pickMatch(t.closest('.match'), t.dataset.act, Number(t.dataset.i));
      break;
    case 'fill':
      padOpen(t);
      break;
  }
});

// ---- 交卷、改分數 ----
const result = document.getElementById('result');
function submit(page) {
  const QUESTIONS = page._questions;
  const score = () => page.querySelector('.score-line').textContent;
  if (!page.classList.contains('locked')) {
    const g = ({ it }) => grade[it.type];
    const blank = QUESTIONS.filter(x => g(x) && !g(x).answered(x.el, x.it)).length;
    if (blank && !confirm(`還有 ${blank} 題沒有寫，確定要交卷嗎？`)) return;
    let right = 0;
    for (const { it, el } of QUESTIONS) {
      if (!g({ it })) continue;
      if (g({ it }).correct(el, it)) { right++; continue; }
      el.classList.add('wrong');
      if (fixAnswer[it.type]) el.insertAdjacentHTML('beforeend', `<span class="fix">${fixAnswer[it.type](it, el)}</span>`);
    }
    page.querySelector('.score-line').textContent = `${right} / ${QUESTIONS.length}`;
    page.classList.add('locked');
  }
  document.getElementById('result-title').innerHTML = ruby('答(ㄉㄚˊ)對(ㄉㄨㄟˋ)');
  document.getElementById('result-score').textContent = score();
  result.hidden = false;
}
document.getElementById('result-close').onclick = () => { result.hidden = true; };

// 只清除目前這份試卷
document.getElementById('clear').onclick = () => {
  const page = curPage();
  const name = window.EXAMS[PAGES.indexOf(page)].name;
  if (!confirm(`確定要清除「${name}」的所有作答嗎？`)) return;
  page.querySelectorAll('.picked').forEach(el => el.classList.remove('picked'));
  page.querySelectorAll('.circled').forEach(el => el.classList.remove('circled'));
  page.querySelectorAll('.user').forEach(el => { el.innerHTML = ''; });
  page.querySelectorAll('[data-val]').forEach(el => { delete el.dataset.val; });
  page.querySelectorAll('.match .sel').forEach(el => el.classList.remove('sel'));
  page.querySelectorAll('.match').forEach(m => { m._links = new Map(); m._pending = null; drawLinks(m); });
  page.querySelectorAll('.fix').forEach(el => el.remove());
  page.querySelectorAll('.q.wrong').forEach(el => el.classList.remove('wrong'));
  page.querySelector('.score-line').textContent = '';
  page.classList.remove('locked');
};
</script>
</body>
