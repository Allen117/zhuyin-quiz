<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>注音練習</title>
<script>
  // 舊連結（index.html?exam=2、?answers）轉到考卷
  if (location.search) location.replace('exam.html' + location.search);
</script>
<style>
  * { box-sizing: border-box; }
  html { touch-action: manipulation; }
  body {
    margin: 0; min-height: 100dvh; background: #eee; color: #000;
    font-family: "DFKai-SB", "BiauKai", "標楷體", "Kaiti TC", serif;
    display: flex; align-items: center; justify-content: center;
  }
  .entry { display: flex; flex-wrap: wrap; justify-content: center; gap: 48px; padding: 24px; }
  .entry button {
    width: 300px; height: 300px; border: 0; border-radius: 32px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    font-family: inherit; font-size: 64px; font-weight: bold; color: #000;
    box-shadow: 0 6px 0 rgba(0,0,0,.2); -webkit-tap-highlight-color: transparent;
  }
  .entry button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .entry .icon { font-size: 110px; line-height: 1; }
  .read { background: #81c784; }
  .exam { background: #ffb74d; }

  /* 注音：符號直排，聲調在右，輕聲點在上（和 exam.html 相同） */
  .zy { display: inline-flex; align-items: flex-end; vertical-align: middle; line-height: 1; }
  .zy-col { display: inline-flex; flex-direction: column; align-items: center; }
  .zy-s { display: block; height: 1em; }
  .zy-tone { display: inline-block; width: .8em; font-size: .6em; margin-bottom: 1.1em; }
  .tn { display: block; width: .8em; height: 1em; }
  .hz { display: inline-flex; align-items: center; margin: 0 .05em; }
  .hz .zy { font-size: .4em; font-weight: normal; margin-left: .1em; }
</style>
</head>
<body>
<div class="entry">
  <button class="read" onclick="location.href = 'read.html'"><span class="icon">📖</span><span data-label="朗(ㄌㄤˇ)讀(ㄉㄨˊ)"></span></button>
  <button class="exam" onclick="location.href = 'exam.html'"><span class="icon">📝</span><span data-label="考(ㄎㄠˇ)卷(ㄐㄩㄢˋ)"></span></button>
</div>

<script>
const TONE_PATH = {
  'ˊ': '<path d="M2.5 8 L5.5 2"/>',
  'ˇ': '<path d="M1.5 3 L4 7.5 L6.5 3"/>',
  'ˋ': '<path d="M2.5 2 L5.5 8"/>',
};
const toneSVG = t => TONE_PATH[t]
  ? `<svg class="tn" viewBox="0 0 8 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">${TONE_PATH[t]}</svg>`
  : '';
function zy(z) {
  let tone = '';
  if ('ˊˇˋ'.includes(z.slice(-1))) { tone = z.slice(-1); z = z.slice(0, -1); }
  const syms = [...z].map(s => `<span class="zy-s">${s}</span>`).join('');
  return `<span class="zy"><span class="zy-col">${syms}</span><span class="zy-tone">${toneSVG(tone)}</span></span>`;
}
const ruby = s => s.replace(/([^()\s])\(([^)]+)\)/g, (_, c, z) => `<span class="hz">${c}${zy(z)}</span>`);
document.querySelectorAll('[data-label]').forEach(el => { el.innerHTML = ruby(el.dataset.label); });
</script>
<script src="update.js"></script>
</body>
</html>
